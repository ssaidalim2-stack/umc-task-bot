<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>UMC Task</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета берём у Telegram, но КАЖДЫЙ имеет собственный запасной вариант под текущую тему.
     Telegram Desktop (особенно Windows) подставляет --tg-theme-* не полностью: если придёт
     тёмный фон, а переменная текста не придёт, текст упадёт на светлый дефолт — отсюда
     «чёрное на чёрном» и «белое на белом». Поэтому тема дублируется через data-theme,
     который выставляется из tg.colorScheme — он есть всегда. */
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8b8b8b);
    --card: var(--tg-theme-secondary-bg-color, #f3f4f6);
    --btn: var(--tg-theme-button-color, #2ea6ff);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --accent:#22c55e;
    --accent2:#8b5cf6;
    --shadow: 0 2px 10px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --line: rgba(127,127,127,.16);
  }
  :root[data-theme="dark"]{
    --bg: var(--tg-theme-bg-color, #17212b);
    --text: var(--tg-theme-text-color, #f1f1f1);
    --hint: var(--tg-theme-hint-color, #9aa4ad);
    --card: var(--tg-theme-secondary-bg-color, #232e3c);
    --btn: var(--tg-theme-button-color, #2ea6ff);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --shadow: 0 2px 14px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
    --line: rgba(255,255,255,.12);
  }
  :root[data-theme="light"]{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --card: var(--tg-theme-secondary-bg-color, #f3f4f6);
  }
  /* Ручной выбор темы. Здесь НЕЛЬЗЯ брать цвет через var(--tg-theme-*): Telegram
     задаёт эти переменные inline-стилем на :root, они всегда определены, и запасное
     значение в var() не сработает — переключатель визуально ничего не менял.
     Поэтому при ручном выборе переменные Telegram игнорируются целиком. */
  :root[data-mode="manual"][data-theme="dark"]{
    --bg:#17212b; --text:#f1f1f1; --hint:#9aa4ad; --card:#232e3c;
    --btn:#2ea6ff; --btn-text:#ffffff;
    --shadow: 0 2px 14px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
    --line: rgba(255,255,255,.12);
  }
  :root[data-mode="manual"][data-theme="light"]{
    --bg:#ffffff; --text:#111111; --hint:#8b8b8b; --card:#f3f4f6;
    --btn:#2ea6ff; --btn-text:#ffffff;
    --shadow: 0 2px 10px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --line: rgba(127,127,127,.16);
  }
  /* системная тема — когда Telegram не сказал ничего */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: var(--tg-theme-bg-color, #17212b);
      --text: var(--tg-theme-text-color, #f1f1f1);
      --hint: var(--tg-theme-hint-color, #9aa4ad);
      --card: var(--tg-theme-secondary-bg-color, #232e3c);
      --shadow: 0 2px 14px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
      --line: rgba(255,255,255,.12);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:74px;font-size:15px;-webkit-font-smoothing:antialiased}
  header{padding:16px 16px 8px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .thbtn{flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px;cursor:pointer;line-height:1;transition:transform .12s ease}
  .thbtn:active{transform:scale(.92)}
  header h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.2px}
  header .sub{color:var(--hint);font-size:13px;margin-top:3px;font-weight:500}
  .wrap{padding:8px 12px}
  .card{background:var(--card);border-radius:16px;padding:15px;margin:10px 0;box-shadow:var(--shadow);border:1px solid var(--line)}
  .card h3{margin:0 0 10px;font-size:16px;font-weight:700;letter-spacing:-.1px;display:flex;align-items:center;gap:2px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .row>input,.row>select,.row>textarea{min-width:0}
  .muted{color:var(--hint);font-size:13px}
  .bar{height:9px;border-radius:6px;background:rgba(127,127,127,.18);overflow:hidden;margin:7px 0}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#4ade80);border-radius:6px;transition:width .4s ease}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;background:rgba(127,127,127,.16);font-size:12px;margin:2px 4px 2px 0;font-weight:600}
  .btn{appearance:none;border:0;border-radius:11px;background:var(--btn);color:var(--btn-text);padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px color-mix(in srgb, var(--btn) 45%, transparent);transition:transform .1s ease,opacity .15s ease}
  .btn:active{transform:scale(.97);opacity:.9}
  .btn.sec{background:rgba(127,127,127,.14);color:var(--text);box-shadow:none}
  .btn.full{width:100%;margin-top:8px}
  .btn.sm{padding:7px 11px;font-size:13px}
  .btn.xs{padding:5px 9px;font-size:12px;border-radius:9px}
  .framewrap{margin:2px 0 6px}
  .frame{border:1px solid rgba(127,127,127,.28);border-radius:12px;padding:9px;margin-bottom:8px;background:var(--bg)}
  .fhead{display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .fhead b{font-size:13px}
  .fsp{flex:1}
  .frow{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
  .rsel{flex:0 0 auto;width:auto;min-width:64px;border-radius:8px;border:1px solid rgba(127,127,127,.3);background:var(--bg);color:var(--text);padding:7px 6px;font-size:13px;font-family:inherit}
  .rta{flex:1;min-height:44px;font-size:14px;padding:8px}
  .frowbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .xbtn{appearance:none;border:1px solid rgba(127,127,127,.3);background:rgba(127,127,127,.12);color:var(--text);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;line-height:1}
  .vid{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:11px 4px;margin:0 -4px;border-bottom:1px solid var(--line);gap:8px;border-radius:8px;transition:background .12s ease}
  .vid:last-child{border-bottom:0}
  .vid[data-topen]{cursor:pointer}
  .vid[data-topen]:active{background:rgba(127,127,127,.08)}
  .tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .tabbar button{flex:1 1 0;min-width:0;background:none;border:0;color:var(--hint);padding:9px 4px 10px;font-size:11px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;transition:color .15s ease}
  .msheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;backdrop-filter:blur(2px)}
  .msheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 14px calc(58px + env(safe-area-inset-bottom));box-shadow:0 -8px 36px rgba(0,0,0,.35)}
  .msheet-title{font-size:15px;font-weight:800;margin-bottom:12px}
  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
  .calwd{text-align:center;font-size:11px;opacity:.6;padding:2px 0}
  .calcell{min-width:0;width:auto;height:40px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:transform .1s ease}
  .calcell:active{transform:scale(.94)}
  .calcell.empty{cursor:default;background:transparent!important}
  .calcell.today .calnum{text-decoration:underline}
  .calcell.sel{box-shadow:inset 0 0 0 2px #fff}
  .calcell.has-shoot{box-shadow:inset 0 0 0 2px #f5a524}
  .calcell.has-shoot.sel{box-shadow:inset 0 0 0 2px #f5a524, inset 0 0 0 4px #fff}
  .calnum{font-weight:600}
  .caldot{font-size:10px;margin-top:1px}
  .umc-logo{display:block;width:auto;color:var(--text)}
  .umc-spin{animation:umcSpin 1.6s ease-in-out infinite}
  @keyframes umcSpin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.86);opacity:.55}}
  .umc-loader{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0}
  #splash{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .35s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .umc-logo{animation:umcIn .55s ease both}
  @keyframes umcIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
  .wkday{padding:12px 14px;margin-top:8px}
  .wktoday{box-shadow:inset 0 0 0 2px var(--btn)}
  .wkitem{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
  .wkitem:first-of-type{border-top:0}
  .mcell{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 4px;border-radius:14px;background:var(--card);font-size:11px;font-weight:600;cursor:pointer;text-align:center;border:1px solid var(--line);transition:transform .1s ease}
  .mcell:active{transform:scale(.95)}
  .mcell span{font-size:23px}
  .mcell.active{outline:2px solid var(--btn);color:var(--btn)}
  .tabbar button.active{color:var(--btn)}
  .tabbar .ic{display:block;font-size:21px;margin-bottom:2px}
  .pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
  .pill{white-space:nowrap;padding:7px 13px;border-radius:20px;background:var(--card);font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);transition:transform .1s ease,box-shadow .15s ease}
  .pill:active{transform:scale(.96)}
  .pill.active{background:var(--btn);color:var(--btn-text);border-color:transparent;box-shadow:0 2px 8px color-mix(in srgb, var(--btn) 40%, transparent)}
  a{color:var(--btn)}
  .empty{text-align:center;color:var(--hint);padding:36px 16px;font-size:14px}
  .stageline{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
  .seg{flex:1;min-width:54px;text-align:center;font-size:11px;font-weight:600;padding:6px 2px;border-radius:8px;background:rgba(127,127,127,.13)}
  .seg.on{background:linear-gradient(135deg,var(--accent),#16a34a);color:#fff}
  textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:10px;font-size:15px;font-family:inherit;resize:vertical;transition:border-color .15s ease}
  input{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:9px 10px;font-size:15px;font-family:inherit;transition:border-color .15s ease}
  input[type=checkbox]{width:16px;height:16px;flex:none;padding:0}
  textarea:focus,input:focus{outline:none;border-color:var(--btn)}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:rgba(127,127,127,.16)}
  .ctab{width:100%;border-collapse:collapse;font-size:13px}
  .ctab th,.ctab td{padding:8px 5px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  .ctab th{color:var(--hint);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .ctab td:first-child,.ctab th:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600}
  .board{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
  .bcol{flex:0 0 80%;max-width:300px;background:var(--card);border-radius:14px;padding:11px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .bhead{font-weight:800;font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .bcount{font-size:12px;font-weight:700;color:var(--hint);background:rgba(127,127,127,.18);border-radius:10px;padding:1px 8px}
  .bcard{background:var(--bg);border-radius:11px;padding:9px 11px;margin-bottom:6px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .rowdl{width:78px;padding:5px 7px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:12px;flex:0 0 auto}
  /* на iPad/десктопе (широкий вьюпорт) центрируем контент разумной ширины вместо растягивания на весь экран.
     Блок стоит В КОНЦЕ таблицы стилей намеренно — иначе более поздние базовые правила (например .tabbar{left:0;right:0}) перебивают центрирование по порядку каскада. */
  @media (min-width:720px){
    header,.wrap{max-width:1100px;margin-left:auto;margin-right:auto;padding-left:18px;padding-right:18px}
    .tabbar{left:0;right:0;width:100%;margin:0;border-radius:0;justify-content:center;gap:28px}
    .tabbar button{max-width:150px}
    .msheet{max-width:720px;margin:0 auto}
    /* на широком экране карточки идут в две колонки — иначе это та же телефонная лента,
       только с огромными полями по бокам */
    .wrap{column-gap:16px}
  }
  @media (min-width:1500px){
    header,.wrap{max-width:1360px}
  }
</style>
</head>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
// tg.colorScheme приходит всегда, в отличие от набора --tg-theme-*; по нему и ставим тему
// 'auto' — как в Telegram, иначе принудительно светлая/тёмная. Выбор запоминается на устройстве.
let THEME_PREF='auto';
try{ THEME_PREF=localStorage.getItem('umc_theme')||'auto'; }catch(e){}
const THEME_ICON={auto:'🌓',light:'☀️',dark:'🌙'};
function applyTheme(){
  try{
    let sc;
    if(THEME_PREF==='light'||THEME_PREF==='dark') sc=THEME_PREF;
    else sc=tg.colorScheme==='dark'?'dark':tg.colorScheme==='light'?'light':'';
    const root=document.documentElement;
    if(sc) root.setAttribute('data-theme',sc); else root.removeAttribute('data-theme');
    // ручной выбор — переменные Telegram в игру не берём
    if(THEME_PREF==='light'||THEME_PREF==='dark') root.setAttribute('data-mode','manual');
    else root.removeAttribute('data-mode');
    const b=document.getElementById('themeBtn');
    if(b){ b.textContent=THEME_ICON[THEME_PREF]; b.title='Тема: '+(THEME_PREF==='auto'?'как в Telegram':THEME_PREF==='light'?'светлая':'тёмная')+' — нажми, чтобы сменить'; }
  }catch(e){}
}
function cycleTheme(){
  THEME_PREF = THEME_PREF==='auto' ? 'light' : THEME_PREF==='light' ? 'dark' : 'auto';
  try{ localStorage.setItem('umc_theme',THEME_PREF); }catch(e){}
  applyTheme();
  try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){}
}
document.addEventListener('DOMContentLoaded',()=>{
  const b=document.getElementById('themeBtn'); if(b) b.onclick=cycleTheme;
  applyTheme();

function readImageCompressed(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const maxDim=1280;
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ const s=maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.75));
      };
      img.onerror=()=>reject(new Error('img'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('file'));
    reader.readAsDataURL(file);
  });
}

// миграция старого формата (rows[]) в единый непрерывный текст кадра
function frameText(fr){
  if(fr.text==null){ fr.text=(fr.rows||[]).map(r=>`${r.r?r.r+': ':''}${r.t||''}`).join(' ').trim(); delete fr.rows; }

// пользовательские роли, уже встречавшиеся в тексте кадров (кроме Д/Т) — предлагаются как кнопки быстрой вставки
function scenarioRoles(it){
  const s=new Set();
  for(const fr of (it.frames||[])){
    const re=/(?:^|[\s.,!?])([A-ZА-ЯЁ][\wа-яёA-Za-z]*)\s*:/g; let m;
    while((m=re.exec(frameText(fr)))) if(!['Д','Т'].includes(m[1])) s.add(m[1]);
  }
  return [...s];
}
function renumberFrames(it){ let n=0; for(const fr of (it.frames||[])) if(fr.kind==='frame') fr._n=(++n); }
// полный текст пункта для копирования: сценарий по кадрам с подписями + референс/реквизиты
// (includeExtras=false — для группового копирования, где реф/реквизиты собираются отдельным списком)
function buildFullScriptText(it,includeExtras){
  if(includeExtras===undefined) includeExtras=true;
  const projName=(DATA.projects||[]).find(p=>p.id==TBL_PROJ)?.name||'';
  const head=[];
  if(projName) head.push('Проект: '+projName);
  if(it.theme&&it.theme.trim()) head.push('Тема: '+it.theme.trim());
  if(it.shoot_date&&it.shoot_date.trim()) head.push('Дата съёмки: '+it.shoot_date.trim()+(it.shoot_time?' '+it.shoot_time:''));
  if(it.deadline&&it.deadline.trim()) head.push('Дедлайн на публикацию: '+it.deadline.trim());
  const plain=s=>String(s||'').replace(/^\S+\s/,''); // отрезать эмодзи-префикс из подписи
  if(it.format) head.push('Формат видео: '+plain(formatLabel(it.format)));
  if(it.lang){ const l=LANG_OPTS.find(x=>x[0]===it.lang); if(l) head.push('Язык видео: '+plain(l[1])); }
  if(it.location&&it.location.trim()) head.push('Локация: '+it.location.trim());

  const frames=[];
  if(it.type==='video' && it.frames && it.frames.length){
    renumberFrames(it);
    it.frames.forEach(fr=>{
      const t=frameText(fr); if(!t.trim()) return;
      const label=fr.kind==='hook'?'ХУК':fr.kind==='cta'?'ПРИЗЫВ (CTA)':('КАДР '+(fr._n||''));
      frames.push(label+':\n'+t);
    });
  } else if(it.script&&it.script.trim()){
    frames.push(it.script.trim());
  }

  const parts=[];
  if(head.length) parts.push(head.join('\n'));
  if(frames.length) parts.push((it.type==='video'?'Сценарий по кадрам:':'Текст:')+'\n\n'+frames.join('\n\n'));
  if(includeExtras){
    if(it.reference&&it.reference.trim()) parts.push('Референс: '+it.reference.trim());
    if(it.props&&it.props.trim()) parts.push('Реквизиты: '+it.props.trim());
  }
  return parts.join('\n\n');
}

// цикл «с 15 по 15»
function cycleDates(back){ // back=0 текущий, 1 прошлый
  const now=new Date(Date.now()+5*3600*1000);
  let y=now.getUTCFullYear(), m=now.getUTCMonth();
  if(now.getUTCDate()<15) m--;
  m-=back;
  const s=new Date(Date.UTC(y,m,15)), e=new Date(Date.UTC(y,m+1,15));
  const today=now.toISOString().slice(0,10);
  const until=e.toISOString().slice(0,10)<=today?e.toISOString().slice(0,10):today;
  return [s.toISOString().slice(0,10), until];
}
async function anLoad(){
  if(!AN_SINCE){ const[s,u]=cycleDates(0); AN_SINCE=s; AN_UNTIL=u; }

// разбор markdown-таблицы, которую возвращает AI (docs/tz-algorithm.md, раздел 7/8),
// в читаемые карточки по блокам — сырая таблица в чате телефона нечитаема
function parseAiTz(raw){
  const lines=String(raw||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const headLine=lines.find(l=>/^Стиль/i.test(l))||'';
  const rowLines=lines.filter(l=>l.startsWith('|')&&l.endsWith('|'));
  if(rowLines.length<2) return null;
  const splitRow=l=>l.slice(1,-1).split('|').map(c=>c.trim());
  const cols=splitRow(rowLines[0]);
  const data=rowLines.slice(1).filter(l=>!/^\|?[\s:|-]+\|?$/.test(l)).map(splitRow);
  if(!data.length) return null;
  return {head:headLine,cols,data};
}
function cellHtml(v){ return esc(v||'').replace(/&lt;br&gt;/gi,'<br>').replace(/&lt;br\/&gt;/gi,'<br>'); }
// то же, что рендерится карточками на экране, но плоским читаемым текстом — для копирования
// (сырой markdown с | и --- нечитаем при вставке в Telegram/куда угодно ещё)
function formatAiTzPlain(raw){
  const parsed=parseAiTz(raw);
  if(!parsed||!parsed.data.length) return raw;
  const blocks=parsed.data.map(row=>parsed.cols.map((c,ci)=>row[ci]?`${c}: ${row[ci].replace(/<br\s*\/?>/gi,' / ')}`:'').filter(Boolean).join('\n'));
  return (parsed.head?parsed.head+'\n\n':'')+blocks.join('\n\n');
}
function renderAiTzBlock(it){
  if(!it.ai_tz) return '';
  const parsed=parseAiTz(it.ai_tz);
  const body=(parsed&&parsed.data.length)
    ? parsed.data.map((row,ri)=>`<div class="card" style="margin-top:6px;padding:10px 12px">
        ${parsed.cols.map((c,ci)=>row[ci]?`<div style="margin-bottom:5px"><span class="muted" style="font-size:11px">${esc(c)}</span><br>${cellHtml(row[ci])}</div>`:'').join('')}
      </div>`).join('')
    : `<textarea readonly style="min-height:220px;font-size:12.5px">${esc(it.ai_tz)}</textarea>`;
  return `<div class="row" style="margin-top:10px"><div class="muted">Раскадровка монтажа (AI)${parsed&&parsed.head?' — '+esc(parsed.head):''}</div><button class="xbtn" data-aicopy>📋 Копировать</button></div>${body}`;
}

// null, если дедлайн ещё не близко; иначе метка срочности для баннера на Главной
function urgencyInfo(deadlineIso){
  if(!deadlineIso) return null;
  const diff=new Date(deadlineIso).getTime()-Date.now();
  if(diff<=0) return {level:'overdue',text:'⛔ просрочено'};
  if(diff<=24*3600*1000) return {level:'soon',text:'через '+Math.max(1,Math.round(diff/3600000))+' ч'};
  return null;
}

function renderMeta(){
  const m=DATA.meta||{};
  const admin=DATA.user.role==='admin';
  let head=`<div class="card"><h3>📲 Instagram + Ads</h3>`;
  if(!m.configured) return head+`<div class="muted">Не подключено. Нужен токен Meta (META_TOKEN) — см. инструкцию у Саида.</div>${admin?'':''}</div>`;
  let body='';
  // привязки проектов (admin)
  if(admin){
    const map=m.map||{};
    body+=`<div class="muted" style="margin-bottom:6px">Привязка аккаунтов к проектам:</div>`;
    body+=DATA.projects.map(p=>{
      const b=map[p.key]||{};
      return `<div class="vid"><span>${esc(p.name)}</span><span style="display:flex;gap:6px;align-items:center">
        <button class="xbtn" data-metabind="${esc(p.key)}|ig">IG ${b.ig?'✅':'—'}</button>
        <button class="xbtn" data-metabind="${esc(p.key)}|ad">Ads ${b.ad?'✅':'—'}</button></span></div>`;
    }).join('');
    body+=`<div class="row" style="gap:6px;margin-top:8px">
      <button class="btn xs sec" data-metastatus>🔍 Аккаунты</button>
      <button class="btn xs sec" data-metapull>⬇️ Обновить за вчера</button>
    </div><div id="metaOut" class="muted" style="font-size:12px;white-space:pre-wrap;margin-top:6px"></div>`;
  }
  // снэпшоты по дням
  const days=m.days||[];
  if(days.length){
    body+=`<div class="muted" style="margin-top:10px">Последние дни:</div>`;
    for(const d of days){
      const rows=Object.entries(d.snap||{}).map(([k,v])=>{
        const proj=DATA.projects.find(p=>p.key===k);
        const nm=proj?proj.name.split(' ')[0]:k;
        if(v.error) return `<div class="vid"><span>${esc(nm)}</span><span class="muted" style="font-size:12px">⚠️ ${esc(v.error).slice(0,60)}</span></div>`;
        const ig=v.ig?`👁 ${v.ig.reach} · ▶️ ${v.ig.views} · 👥 ${v.ig.followers}`:'';
        const ads=v.ads?` · 💰 ${v.ads.spend} ${v.ads.currency} → ${v.ads.results} рез.`:'';
        return `<div class="vid"><span>${esc(nm)}</span><span class="muted" style="font-size:12px">${ig}${ads}</span></div>`;
      }).join('');
      body+=`<div class="muted" style="margin-top:6px;font-weight:600">${d.day}</div>${rows}`;
    }
  } else if(!admin){
    body+=`<div class="muted">Данных пока нет — снэпшоты подтягиваются каждое утро.</div>`;
  }
  return head+body+`</div>`;
}

function fmtN(n){ return (n==null?0:n).toLocaleString('ru-RU'); }
function fmtM(n,cur){ return (Math.round(n*100)/100).toLocaleString('ru-RU')+' '+(cur||''); }
function renderAnalytics(){
  const projs=DATA.projects.filter(p=>{const m=(DATA.meta&&DATA.meta.map)||{};return m[p.key]&&(m[p.key].ig||m[p.key].ad);});

  const secPills=[['ads','🎯 Таргет'],['media','🎬 Результат видео'],['cmp','⚖️ Сравнение']]
    .map(([k,l])=>`<div class="pill ${AN_SEC==k?'active':''}" data-ansec="${k}">${l}</div>`).join('');
  const projPills=AN_SEC==='cmp'?'':`<div class="pills">${projs.map(p=>`<div class="pill ${p.key===AN_PROJ?'active':''}" data-anproj="${p.key}">${esc(p.name.split(' ')[0])}</div>`).join('')}</div>`;
  const [c0s]=cycleDates(0), [c1s,c1u]=cycleDates(1);
  const dates=`<div class="row" style="gap:6px;flex-wrap:wrap;margin:6px 0">
    <button class="btn xs ${AN_SINCE===c0s?'':'sec'}" data-ancycle="0">Текущий цикл (15→15)</button>
    <button class="btn xs ${AN_SINCE===c1s&&AN_UNTIL===c1u?'':'sec'}" data-ancycle="1">Прошлый цикл</button>
  </div>
  <div class="row" style="gap:6px;flex-wrap:wrap">
    <input type="date" id="anSince" value="${AN_SINCE}" style="flex:1 1 120px;min-width:0">
    <input type="date" id="anUntil" value="${AN_UNTIL}" style="flex:1 1 120px;min-width:0">
    <button class="btn xs" data-anshow style="flex:0 0 auto">Показать</button>
  </div>`;
  let body='';
  if(!projs.length) body='<div class="empty">Ни один проект не привязан к Meta.<br>Отчёт → 🔍 Аккаунты → кнопки IG/Ads.</div>';
  else if(AN_LOADING) body='<div class="empty">⏳ Загружаю данные Meta…</div>';
  else if(AN_ERR) body=`<div class="empty">⚠️ ${esc(AN_ERR)}</div>`;
  else if(!AN_DATA){ if(AN_PROJ||AN_SEC==='cmp') setTimeout(anLoad,0); body='<div class="empty">⏳</div>'; }
  else if(AN_SEC==='ads') body=anAds();
  else if(AN_SEC==='media') body=anMedia();
  else body=anCmp();
  return `<div class="pills">${secPills}</div>${projPills}<div class="card">${dates}</div>${body}`;

function anCmp(){
  const rows=(AN_DATA.rows||[]);
  if(!rows.length) return '<div class="empty">Нет привязанных проектов</div>';
  const met=[['spend','💰 Затраты'],['results','🎯 Результаты'],['reach','👁 Охват'],['views','▶️ Просмотры'],['followerGain','👥 +Подписчики']];
  let h='<div class="card"><h3>⚖️ Сравнение проектов</h3>';
  for(const[k,l]of met){
    const max=Math.max(...rows.map(r=>r[k]||0),1);
    const sum=rows.reduce((a,r)=>a+(r[k]||0),0);
    h+=`<div class="muted" style="margin-top:10px;font-weight:600">${l}${sum?` · всего ${k==='spend'?fmtM(sum,rows[0].currency):fmtN(sum)}`:''}</div>`;
    h+=rows.map(r=>{
      const v=r[k]||0, pct=sum?Math.round(v/sum*100):0;
      return `<div class="row" style="gap:8px;margin-top:3px"><span style="flex:0 0 90px;font-size:13px">${esc(r.name.split(' ')[0])}</span>
        <div style="flex:1;height:14px;background:rgba(127,127,127,.15);border-radius:7px;overflow:hidden"><div style="height:100%;width:${Math.round(v/max*100)}%;background:var(--accent)"></div></div>
        <span style="flex:0 0 auto;font-size:12px" class="muted">${k==='spend'?fmtM(v,r.currency):fmtN(v)} · ${pct}%</span></div>`;
    }).join('');
  }
  const errs=rows.filter(r=>r.error);
  if(errs.length) h+='<div class="muted" style="font-size:12px;margin-top:8px">'+errs.map(r=>`⚠️ ${esc(r.name)}: ${esc(r.error).slice(0,60)}`).join('<br>')+'</div>';
  h+='</div>';
  const labels=rows.map(r=>r.name.split(' ')[0]);
  const chart={type:'bar',data:{labels,datasets:[
    {label:'Результаты',data:rows.map(r=>r.results||0),backgroundColor:'#22c55e'},
    {label:'Охват (тыс.)',data:rows.map(r=>Math.round((r.reach||0)/1000)),backgroundColor:'#60a5fa'},
    {label:'+Подписчики',data:rows.map(r=>r.followerGain||0),backgroundColor:'#f59e0b'}]}};
  h+=`<div class="card"><img src="https://quickchart.io/chart?w=560&h=300&c=${encodeURIComponent(JSON.stringify(chart))}" style="width:100%;border-radius:10px"></div>`;
  return h;
}

// ---- календарь съёмок (циклы 15→15, читает/пишет те же shoot_date/shoot_time/shoot_manager,
// что и таблица контент-плана — единый источник данных, календарь просто другой вид) ----
let CAL_CURSOR=null, CAL_DAY=null, CAL_ADD=false;
let CAL_ADD_PROJ=null, CAL_ADD_ITEMS=null, CAL_ADD_SEL=null, CAL_ADD_MANAGER=null, CAL_ADD_TIME='', CAL_ADD_EXISTING=[];
let CAL_EDIT_PROJ=null, CAL_EDIT_MGR=null;
const CAL_WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MONTH_NAMES=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function isoKey(y,m,day){ return `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`; }
// якорим на Ташкент (+5), а не на локаль устройства зрителя — иначе граница дня "плывёт"
function tashkentNow(){ return new Date(Date.now()+5*3600*1000); }
function calCycleStart(d){ let y=d.getUTCFullYear(), m=d.getUTCMonth(); if(d.getUTCDate()<15){ m--; if(m<0){m=11;y--;} } return {y,m}; }
function monthColor(m){ return `hsl(${m*30},32%,17%)`; }
function renderCalendar(){
  if(!CAL_CURSOR) CAL_CURSOR=calCycleStart(tashkentNow());
  const {y,m}=CAL_CURSOR;
  const endM=m===11?0:m+1, endY=m===11?y+1:y;
  const startUTC=Date.UTC(y,m,15), endUTC=Date.UTC(endY,endM,14);
  const days=[];
  for(let t=startUTC;t<=endUTC;t+=86400000){ const dt=new Date(t); days.push({y:dt.getUTCFullYear(),m:dt.getUTCMonth(),day:dt.getUTCDate(),wd:dt.getUTCDay()}); }
  const shootsByDay={};
  (DATA.calendarShoots||[]).forEach(s=>{ (shootsByDay[s.day]=shootsByDay[s.day]||[]).push(s); });
  const nowT=tashkentNow();
  const todayKey=isoKey(nowT.getUTCFullYear(),nowT.getUTCMonth(),nowT.getUTCDate());
  const leadBlank=(days[0].wd+6)%7; // неделя с понедельника
  const cells=[]; for(let i=0;i<leadBlank;i++) cells.push(null); days.forEach(d=>cells.push(d));
  while(cells.length%7) cells.push(null);
  const cellsHtml=cells.map(d=>{
    if(!d) return '<div class="calcell empty"></div>';
    const key=isoKey(d.y,d.m,d.day);
    const shoots=shootsByDay[key]||[];
    const groupCount=new Set(shoots.map(s=>s.projectId)).size; // считаем съёмки (проекты), не видео по отдельности
    const cls=['calcell']; if(shoots.length) cls.push('has-shoot'); if(key===todayKey) cls.push('today'); if(key===CAL_DAY) cls.push('sel');
    return `<div class="${cls.join(' ')}" data-calday="${key}" style="background:${monthColor(d.m)}">
      <div class="calnum">${d.day}</div>
      ${groupCount?`<div class="caldot">🎬${groupCount>1?' '+groupCount:''}</div>`:''}
    </div>`;
  }).join('');
  const label=`${MONTH_NAMES[m]} → ${MONTH_NAMES[endM]} (15.${String(m+1).padStart(2,'0')}–14.${String(endM+1).padStart(2,'0')})`;

  let dayPanel='';
  if(CAL_DAY){
    const shoots=shootsByDay[CAL_DAY]||[];
    // одна реальная съёмка = один проект в этот день, а не по видео отдельно
    const byProj={};
    shoots.forEach(s=>{ (byProj[s.projectId]=byProj[s.projectId]||{projectId:s.projectId,projectName:s.projectName,items:[]}).items.push(s); });
    const groups=Object.values(byProj);
    const [dy,dm,dd]=CAL_DAY.split('-');
    dayPanel=`<div class="card" style="margin-top:10px">
      <div class="row"><h3>${dd}.${dm}.${dy}</h3><button class="btn sm sec" data-caldayclose>✕</button></div>
      ${groups.length?groups.map(g=>{
        const first=g.items[0];
        const editForm=CAL_EDIT_PROJ===g.projectId?`<div class="card" style="margin-top:6px;padding:10px">
          <div class="muted">Менеджер на съёмке:</div><div class="pills">${(DATA.calendarManagers||[]).map(mm=>`<div class="pill ${CAL_EDIT_MGR==mm.id?'active':''}" data-caleditmgr="${mm.id}">${esc(mm.name)}</div>`).join('')||'<div class="muted" style="font-size:12px">Нет менеджеров в команде</div>'}</div>
          <div class="muted" style="margin-top:6px">Время:</div><input type="time" id="caledit_time" value="${esc(first.shoot_time||'')}">
          <div class="row" style="gap:6px;margin-top:8px"><button class="btn xs" data-caleditsave="${g.projectId}">💾 Сохранить</button><button class="btn xs sec" data-caleditcancel>Отмена</button></div>
        </div>`:'';
        const itemsList=g.items.map(s=>`<div class="muted" style="font-size:13px">• ${esc(s.theme||'без темы')}${s.format?' · '+formatLabel(s.format):''}</div>`).join('');
        return `<div class="vid" style="align-items:flex-start">
        <div style="min-width:0;flex:1">
          <div><b>${esc(g.projectName)}</b> <span class="muted" style="font-size:12px">(${g.items.length} видео)</span></div>
          ${itemsList}
          <div class="muted" style="font-size:12px;margin-top:2px">${first.shoot_time?'🕒 '+esc(first.shoot_time)+' · ':''}${first.shoot_manager?'👤 '+esc(first.shoot_manager):'менеджер не назначен'}</div>
          ${editForm}
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;flex:0 0 auto">
          <button class="xbtn" data-caledittoggle="${g.projectId}" title="Менеджер/время">✎</button>
          <button class="xbtn" data-caladdmore="${g.projectId}" title="Добавить ещё видео в эту съёмку">＋видео</button>
          <button class="xbtn" data-caljump="${first.id}:${first.projectId}:${first.planId}">Открыть →</button>
          <button class="xbtn" data-calcleargroup="${g.items.map(s=>s.id).join(',')}" title="Убрать всю съёмку">✕ дата</button>
        </div>
      </div>`;
      }).join(''):'<div class="muted">Съёмок не назначено</div>'}

function storyStatusLabel(k){ const o=STORY_STATUS.find(x=>x[0]===k); return o?o[1]:'🕒 Запланировано'; }
let ST_PROJ=null, ST_WEEK=null, ST_LIST=null, ST_LOADED=null, ST_OPEN=null, ST_EDIT=null;

// ---- недельный план (Пн–Вс): задачи по сотрудникам на каждый день ----
// хранятся как обычные задачи с дедлайном на этот день, поэтому попадают
// и в «Мои задачи», и в напоминания, и в статистику
let WK_START=null, WK_TASKS=null, WK_PLANNER=false, WK_LOADED=null, WK_EMP=null, WK_DAY=null;
function mondayOf(d){ const wd=(d.getUTCDay()+6)%7; return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-wd)); }
function wkKey(dt){ return dt.toISOString().slice(0,10); }
function wkShift(iso,days){ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+days); return wkKey(d); }
async function wkLoad(){
  WK_LOADED=WK_START;
  const res=await api('POST',{type:'week_tasks',weekStart:WK_START});
  WK_TASKS=(res&&res.weekTasks)||[]; WK_PLANNER=!!(res&&res.weekPlanner);
  render();
}
function renderWeek(){
  if(!WK_START) WK_START=wkKey(mondayOf(tashkentNow()));
  if(WK_LOADED!==WK_START){ WK_TASKS=null; setTimeout(wkLoad,0); }
  const days=[...Array(7)].map((_,i)=>wkShift(WK_START,i));
  const dLabel=iso=>{const[,m,d]=iso.split('-');return d+'.'+m;};
  const range=dLabel(days[0])+' – '+dLabel(days[6]);
  // без подписи непонятно, какая неделя открыта, и что стрелки вообще листают недели
  const thisMon=wkKey(mondayOf(tashkentNow()));
  const diffW=Math.round((new Date(WK_START+'T00:00:00Z')-new Date(thisMon+'T00:00:00Z'))/604800000);
  const weekLabel=diffW===0?'эта неделя':diffW===1?'следующая':diffW===-1?'прошлая':(diffW>0?`через ${diffW} нед.`:`${-diffW} нед. назад`);
  if(WK_TASKS===null) return `<div class="card"><h3>🗓 Недельный план</h3>${umcLoader()}</div>`;

  const nowKey=wkKey(tashkentNow());
  // кого показываем: планировщик видит всех, остальные — только себя
  const people=WK_PLANNER
    ? (DATA.assignable&&DATA.assignable.length?DATA.assignable:[{id:DATA.user.id,name:DATA.user.name,role:''}])
    : [{id:DATA.user.id,name:DATA.user.name||'Мои задачи',role:''}];
  if(WK_EMP==null||!people.some(p=>p.id===WK_EMP)) WK_EMP=people[0]?.id??null;
  const empPills=WK_PLANNER&&people.length>1
    ? `<div class="pills">${people.map(p=>{
        const cnt=WK_TASKS.filter(t=>t.assigneeId===p.id).length;
        return `<div class="pill ${p.id===WK_EMP?'active':''}" data-wkemp="${p.id}">${esc(p.name)}${cnt?' · '+cnt:''}</div>`;
      }).join('')}</div>`
    : '';

  const rows=days.map(iso=>{
    const list=WK_TASKS.filter(t=>t.day===iso&&t.assigneeId===WK_EMP);
    const done=list.filter(t=>t.status==='done').length;
    const isToday=iso===nowKey;
    const items=list.length?list.map(t=>{
      const isDone=t.status==='done';
      const mine=t.assigneeId===DATA.user.id;
      const btn=!isDone&&mine?`<button class="btn xs" data-done="${t.id}">Выполнено</button>`:'';
      const del=DATA.user.role==='admin'?`<button class="xbtn" data-taskdel="${t.id}" title="Удалить">🗑</button>`:'';
      return `<div class="wkitem"><span style="min-width:0;flex:1;${isDone?'opacity:.55;text-decoration:line-through':''}">${esc(t.title)}</span><span style="display:flex;gap:4px;flex:0 0 auto">${btn}${del}</span></div>`;
    }).join(''):'<div class="muted" style="font-size:12px">—</div>';
    const addForm=(WK_PLANNER&&WK_DAY===iso)
      ? `<div style="margin-top:6px"><input id="wk_title" placeholder="Что нужно сделать…"><div class="row" style="gap:6px;margin-top:6px"><button class="btn xs" data-wkadd="${iso}">Добавить</button><button class="btn xs sec" data-wkaddcancel>Отмена</button></div></div>`
      : (WK_PLANNER?`<button class="btn xs sec" data-wkaddopen="${iso}" style="margin-top:6px">＋ задача</button>`:'');
    return `<div class="card wkday ${isToday?'wktoday':''}">
      <div class="row"><b>${CAL_WD[days.indexOf(iso)]}, ${dLabel(iso)}${isToday?' · сегодня':''}</b>${list.length?`<span class="chip">${done}/${list.length}</span>`:''}</div>
      ${items}${addForm}
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="row"><button class="btn sm sec" data-wkprev title="Предыдущая неделя">◀</button>
      <div style="flex:1;min-width:0;text-align:center"><h3 style="margin:0">🗓 ${range}</h3><div class="muted" style="font-size:12px">${weekLabel}</div></div>
      <button class="btn sm sec" data-wknext title="Следующая неделя">▶</button></div>
    ${diffW===0?'<div class="muted" style="font-size:12px;margin-top:4px">▶ — спланировать следующую неделю заранее</div>':''}
    ${empPills}
    ${WK_PLANNER?'':'<div class="muted" style="font-size:12px">Твои задачи на эту неделю.</div>'}
  </div>${rows}`;
}
function renderMyWork(){
  const w=DATA.myWork||[];
  if(!w.length) return '<div class="card"><h3>🗂️ Моя работа</h3><div class="muted">Сейчас нет элементов на твоём этапе 🎉</div></div>';

function autoGrow(t){ t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }
function bind(){
  document.querySelectorAll('textarea').forEach(t=>{ autoGrow(t); t.oninput=()=>autoGrow(t); });
  // автосохранение карточки пункта: любое изменение поля ставит отложенное сохранение
  if(TAB==='plan'&&TBL_OPEN!=null){
    ['f_theme','f_reference','f_props','f_location','f_shoot','f_deadline','f_script']

    const id=+b.dataset.projsave;
    const ids=[...document.querySelectorAll(`[data-projchk^="${id}:"]`)].filter(c=>c.checked).map(c=>+c.dataset.projchk.split(':')[1]);
    TEAM_PROJ_OPEN=null;
    act({type:'team_set_projects',id,projectIds:ids});
  });
  document.querySelectorAll('[data-rolesave]').forEach(b=>b.onclick=()=>{
    const id=+b.dataset.rolesave;
    const isAdminChk=document.querySelector(`[data-roleadmin="${id}"]`);
    const isAdmin=isAdminChk?isAdminChk.checked:false;
    const roles=[...document.querySelectorAll(`[data-rolechk^="${id}:"]`)].filter(c=>c.checked).map(c=>c.dataset.rolechk.split(':')[1]);
    TEAM_ROLE_OPEN=null;
    act({type:'team_set_roles',id,roles,isAdmin});
  });
  document.querySelectorAll('[data-permtoggle]').forEach(b=>b.onclick=()=>{const id=+b.dataset.permtoggle;TEAM_PERM_OPEN=(TEAM_PERM_OPEN===id?null:id);TEAM_ROLE_OPEN=null;TEAM_PROJ_OPEN=null;render();});
  document.querySelectorAll('[data-permsave]').forEach(b=>b.onclick=()=>{
    const id=+b.dataset.permsave;
    const boxes=document.querySelectorAll('[data-permchk^="'+id+':"]');
    const tabs=[...boxes].filter(c=>c.checked).map(c=>c.dataset.permchk.split(':')[1]);
    TEAM_PERM_OPEN=null; act({type:'team_set_tabs',id,tabs});
  });
  document.querySelectorAll('[data-permreset]').forEach(b=>b.onclick=()=>{TEAM_PERM_OPEN=null; act({type:'team_set_tabs',id:+b.dataset.permreset,tabs:null});});
  document.querySelectorAll('[data-projdesc]').forEach(ta=>ta.onblur=()=>act({type:'project_set_desc',id:+ta.dataset.projdesc,description:ta.value}));
  document.querySelectorAll('[data-projtoggle]').forEach(b=>b.onclick=()=>{
    const[id,flag]=b.dataset.projtoggle.split(':'); const archiving=flag==='1';
    const run=()=>act({type:archiving?'project_archive':'project_unarchive',id:+id});
    if(archiving && tg.showConfirm){ tg.showConfirm('Перенести проект в архив? Данные сохранятся, можно будет восстановить.',(ok)=>{if(ok)run();}); } else run();
  });
  const pcreate=document.querySelector('[data-proj-create]'); if(pcreate) pcreate.onclick=async()=>{
    const name=(val('projName')||'').trim();
    if(!name){tg.showAlert&&tg.showAlert('Впиши название проекта');return;}
    await act({type:'project_create',name,description:val('projDesc')});
    tg.showAlert&&tg.showAlert('Проект создан ✅');
  };
  document.querySelectorAll('[data-tzp]').forEach(b=>b.onclick=()=>{captureTZ();TZ_PROJ=b.dataset.tzp;TZ_ITEM=null;render();});
  const tzPhotoInput=document.getElementById('tzPhoto');
  if(tzPhotoInput) tzPhotoInput.onchange=async()=>{const f=tzPhotoInput.files[0];if(!f)return;try{TZ_PHOTO=await readImageCompressed(f);}catch(e){tg.showAlert&&tg.showAlert('Не удалось прочитать фото');}render();};
  document.querySelectorAll('[data-tzphoto-clear]').forEach(b=>b.onclick=()=>{TZ_PHOTO=null;render();});
  const send=document.querySelector('[data-tz-send]');
  if(send) send.onclick=async()=>{captureTZ();const tpl=TZ_TEMPLATES[TZ_SEC]||[];const lines=[];tpl.forEach(([id,label])=>{const v=(TZ_FIELDS[id]||'').trim();if(v)lines.push(label+': '+v);});const text=lines.join('\n');if(!text){tg.showAlert&&tg.showAlert('Заполни хотя бы одно поле');return;}await act({type:'tz',section:TZ_SEC,execId:TZ_EXEC,projectId:TZ_PROJ||null,itemId:TZ_ITEM,text,photo:TZ_PHOTO||null});TZ_FIELDS={};TZ_PHOTO=null;render();tg.showAlert&&tg.showAlert('ТЗ отправлено ✅');};

  // ---- таблица ----
  document.querySelectorAll('[data-tproj]').forEach(b=>b.onclick=()=>{TBL_PROJ=+b.dataset.tproj;TBL_PLAN=null;TBL_OPEN=null;TBL_NEWPERIOD=false;render();});
  document.querySelectorAll('[data-tplan]').forEach(b=>b.onclick=()=>{TBL_PLAN=+b.dataset.tplan;TBL_OPEN=null;TBL_NEWPERIOD=false;render();});
  const pnew=document.querySelector('[data-tplan-new]'); if(pnew) pnew.onclick=()=>{TBL_NEWPERIOD=!TBL_NEWPERIOD;render();};
  const pmgr=document.querySelector('[data-periodmgr]'); if(pmgr) pmgr.onclick=()=>{TBL_PERIOD_MGR=!TBL_PERIOD_MGR;render();};
  document.querySelectorAll('[data-planactivate]').forEach(b=>b.onclick=()=>act({type:'plan_set_active',projectId:TBL_PROJ,planId:+b.dataset.planactivate}));
  document.querySelectorAll('[data-plandel]').forEach(b=>b.onclick=()=>{
    const id=+b.dataset.plandel;
    const del=()=>act({type:'plan_delete',planId:id});
    if(tg.showConfirm){tg.showConfirm('Удалить период и ВСЕ пункты в нём? Это необратимо.',(ok)=>{if(ok)del();});}else del();
  });
  const npc=document.querySelector('[data-np-create]'); if(npc) npc.onclick=async()=>{const period=(val('np_name')||'').trim(); if(!period){tg.showAlert&&tg.showAlert('Введите название периода');return;} const videos=parseInt(val('np_videos'))||0, graphics=parseInt(val('np_graphics'))||0; const res=await api('POST',{type:'plan_create',projectId:TBL_PROJ,period,videos,graphics}); if(res&&res.projects){DATA=res;} TBL_NEWPERIOD=false;TBL_PLAN=null;TBL_LOADED=null; render(); tg.showAlert&&tg.showAlert('Период создан ✅');};
  document.querySelectorAll('[data-topen]').forEach(b=>b.onclick=()=>{
    TBL_OPEN=+b.dataset.topen; UNDO=[]; clearTimeout(AS_TIMER);
    const it=(TBL_ITEMS||[]).find(x=>x.id==TBL_OPEN); AS_STATE=it?itemFingerprint(it):'';
    render();
  });
  const tclose=document.querySelector('[data-tclose]'); if(tclose) tclose.onclick=async()=>{
    clearTimeout(AS_TIMER); await runAutosave(true);   // не терять недописанное при выходе
    TBL_OPEN=null; UNDO=[]; render();
  };
  document.querySelectorAll('[data-titype]').forEach(b=>b.onclick=()=>{const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(it){captureFields(it); it.type=b.dataset.titype; if(!STATUS_OPTS(it.type).some(s=>s[0]==it.stage)) it.stage=STATUS_OPTS(it.type)[0][0];} render(); scheduleAutosave();});
  document.querySelectorAll('[data-tstatus]').forEach(b=>b.onclick=()=>{const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(it){captureFields(it); it.stage=b.dataset.tstatus;} render(); scheduleAutosave();});
  document.querySelectorAll('[data-tlang]').forEach(b=>b.onclick=()=>{const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(it){captureFields(it); it.lang=(it.lang===b.dataset.tlang?'':b.dataset.tlang);} render(); scheduleAutosave();});
  document.querySelectorAll('[data-tformat]').forEach(b=>b.onclick=()=>{const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(it){captureFields(it); it.format=(it.format===b.dataset.tformat?'':b.dataset.tformat);} render(); scheduleAutosave();});
  document.querySelectorAll('[data-tadd]').forEach(b=>b.onclick=()=>act({type:'item_add',planId:TBL_PLAN,projectId:TBL_PROJ,itemType:b.dataset.tadd}));
  document.querySelectorAll('[data-tlock]').forEach(b=>b.onclick=()=>act({type:'item_lock',id:+b.dataset.tlock,planId:TBL_PLAN}));
  const tsave=document.querySelector('[data-tsave]'); if(tsave) tsave.onclick=()=>busyClick(tsave, async()=>{const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); captureFrames(it); if(document.getElementById('f_script')) it.script=val('f_script'); const newPos=parseInt(val('f_pos'))||it.idx; const fields={type:it.type,status:it.stage,lang:it.lang||'',format:it.format||'',theme:val('f_theme'),script:it.script||'',frames:it.frames||[],reference:val('f_reference'),props:val('f_props'),location:val('f_location'),shoot_date:val('f_shoot'),deadline:val('f_deadline')}; let res=await api('POST',{type:'item_update',id:it.id,planId:TBL_PLAN,fields}); if(res&&res.error){tg.showAlert&&tg.showAlert(res.error); if(res.items)TBL_ITEMS=res.items; render(); return;} if(newPos!==it.idx){ res=await api('POST',{type:'item_move',id:it.id,planId:TBL_PLAN,toPos:newPos}); } if(res&&res.items)TBL_ITEMS=res.items; TBL_OPEN=null; render();});
  const tzsend=document.querySelector('[data-tzsend]'); if(tzsend) tzsend.onclick=()=>busyClick(tzsend, async()=>{
    const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(!it) return;
    captureFrames(it); if(document.getElementById('f_script')) it.script=val('f_script');
    const theme=val('f_theme'), script=it.script||'', reference=val('f_reference'), props=val('f_props'), deadline=val('f_deadline');
    if(!theme.trim()||!script.trim()){tg.showAlert&&tg.showAlert('Заполни тему и текст/сценарий перед отправкой ТЗ');return;}
    if(!deadline.trim()){tg.showAlert&&tg.showAlert('Укажи дедлайн — бот подставит его в ТЗ автоматически');return;}
    const fields={type:it.type,status:it.stage,lang:it.lang||'',format:it.format||'',theme,script,frames:it.frames||[],reference,props,location:val('f_location'),shoot_date:it.type==='video'?val('f_shoot'):'',deadline};
    let res=await api('POST',{type:'item_update',id:it.id,planId:TBL_PLAN,fields});
    if(res&&res.error){tg.showAlert&&tg.showAlert(res.error); if(res.items)TBL_ITEMS=res.items; render(); return;}
    if(res&&res.items)TBL_ITEMS=res.items;
    // тот же формат, что и у кнопки «Копировать» — единый вид ТЗ везде
    const fresh={...it,theme,script,reference,props,deadline,location:val('f_location'),shoot_date:it.type==='video'?val('f_shoot'):''};
    const lines=[buildFullScriptText(fresh)];
    const section=it.type==='video'?'edit':'design';
    await act({type:'tz',section,execId:null,projectId:TBL_PROJ,itemId:it.id,deadline,text:lines.join('\n')});
    tg.showAlert&&tg.showAlert('ТЗ отправлено ✅');
  });
  const airaska=document.querySelector('[data-airaska]'); if(airaska) airaska.onclick=async()=>{
    const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(!it) return;
    captureFrames(it); if(document.getElementById('f_script')) it.script=val('f_script');
    const script=it.script||'';
    if(!script.trim()){tg.showAlert&&tg.showAlert('Сначала заполни сценарий');return;}
    const fields={type:it.type,status:it.stage,lang:it.lang||'',format:it.format||'',theme:val('f_theme'),script,frames:it.frames||[],reference:val('f_reference'),props:val('f_props'),location:val('f_location'),shoot_date:it.type==='video'?val('f_shoot'):'',deadline:val('f_deadline')};
    await api('POST',{type:'item_update',id:it.id,planId:TBL_PLAN,fields});
    const prevTxt=airaska.textContent; airaska.textContent='⏳ Генерирую раскадровку…'; airaska.disabled=true;
    const res=await api('POST',{type:'item_ai_tz',id:it.id,planId:TBL_PLAN,script});
    airaska.textContent=prevTxt; airaska.disabled=false;
    if(res&&res.items)TBL_ITEMS=res.items;
    if(res&&res.error){tg.showAlert&&tg.showAlert(res.error);} else {tg.showAlert&&tg.showAlert('Раскадровка готова ✅');}
    render();
  };
  const aicopy=document.querySelector('[data-aicopy]'); if(aicopy) aicopy.onclick=async()=>{
    const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(!it||!it.ai_tz) return;
    const ok=await copyText(formatAiTzPlain(it.ai_tz)); haptic();
    tg.showAlert&&tg.showAlert(ok?'Скопировано в буфер ✅':'Не удалось скопировать');
  };
  // ---- редактор сценария по кадрам ----
  const _ci=()=>TBL_ITEMS.find(x=>x.id==TBL_OPEN);
  const fmut=(fn)=>{const it=_ci(); if(!it)return; captureFields(it); if(!it.frames)it.frames=[]; fn(it); render(); scheduleAutosave();};
  document.querySelectorAll('[data-fnew]').forEach(b=>b.onclick=()=>fmut(it=>{const k=b.dataset.fnew,fr={kind:k,rows:[]}; k==='hook'?it.frames.unshift(fr):it.frames.push(fr);}));
  document.querySelectorAll('[data-fins]').forEach(b=>b.onclick=()=>fmut(it=>it.frames.splice(+b.dataset.fins+1,0,{kind:'frame',rows:[]})));
  document.querySelectorAll('[data-fup]').forEach(b=>b.onclick=()=>fmut(it=>{const i=+b.dataset.fup; if(i>0){const[f]=it.frames.splice(i,1);it.frames.splice(i-1,0,f);}}));
  document.querySelectorAll('[data-fdn]').forEach(b=>b.onclick=()=>fmut(it=>{const i=+b.dataset.fdn; if(i<it.frames.length-1){const[f]=it.frames.splice(i,1);it.frames.splice(i+1,0,f);}}));
  document.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=()=>fmut(it=>it.frames.splice(+b.dataset.fdel,1)));
  document.querySelectorAll('[data-finsert]').forEach(b=>b.onclick=()=>fmut(it=>{
    const[fi,role]=b.dataset.finsert.split(':');
    const fr=it.frames[+fi]; const cur=frameText(fr);
    fr.text=(cur?cur+' ':'')+role+': ';
  }));
  document.querySelectorAll('[data-frole2]').forEach(b=>b.onclick=()=>{
    const name=(prompt('Название роли (напр. Голос, Локация, Актёр):')||'').trim();
    if(name) fmut(it=>{const fi=+b.dataset.frole2; const fr=it.frames[fi]; const cur=frameText(fr); fr.text=(cur?cur+' ':'')+name+': ';});
  });
  const copyBtn=document.querySelector('[data-copyscript]'); if(copyBtn) copyBtn.onclick=async()=>{
    const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(!it) return;
    captureFields(it);
    const text=buildFullScriptText(it);
    if(!text.trim()){ tg.showAlert&&tg.showAlert('Сценарий пуст — нечего копировать'); return; }
    const ok=await copyText(text); haptic();
    tg.showAlert&&tg.showAlert(ok?'Скопировано в буфер ✅':'Не удалось скопировать');
  };
  // ---- Meta (IG + Ads) ----
  const mOut=(t)=>{const e=document.getElementById('metaOut'); if(e)e.textContent=t;};
  const mst=document.querySelector('[data-metastatus]'); if(mst) mst.onclick=async()=>{
    mOut('Проверяю токен…');
    const r=await api('POST',{type:'meta_status'});
    if(!r){mOut('⚠️ ошибка');return;}
    if(!r.configured){mOut('Токен не задан (META_TOKEN).');return;}
    if(r.error){
      // показываем настоящую причину, а не «аккаунтов нет»
      mOut('❌ Токен не работает\n\n'+r.error+'\n\nЧто делать: проверь приложение на developers.facebook.com → статус и ограничения, затем выпусти новый long-lived токен и замени META_TOKEN на Vercel.');
      return;
    }
    if(r.token&&r.token.ok){
      mOut('✅ Токен работает — '+(r.token.who||'')+(r.token.scopes&&r.token.scopes.length?('\nПрава: '+r.token.scopes.join(', ')):'')+'\n\nЗагружаю аккаунты…');
    }
    let s='Instagram-аккаунты:\n'+(r.igAccounts||[]).map(a=>`@${a.username} (${a.src||''}) — id ${a.ig_id}`).join('\n');
    s+='\n\nРекламные кабинеты:\n'+(r.adAccounts||[]).map(a=>`${a.name}${a.src?' ('+a.src+')':''} — ${a.id}`).join('\n');
    for(const b of (r.businesses||[])){
      s+=`\n\n🏢 ${b.name}:`;
      for(const p of (b.pages||[])) s+=`\n  стр. ${p.name}${p.ig?` · IG @${p.ig.username} — ${p.ig.id}`:''}`;
      for(const a of (b.adAccounts||[])) s+=`\n  кабинет ${a.name} — ${a.id}`;
    }
    s+='\n\nПривязка: кнопки IG/Ads у проекта ниже.';
    mOut(s);
    // после загрузки списка — дорисуем кнопки привязки
    window.META_ACC=r;
  };
  const mpl=document.querySelector('[data-metapull]'); if(mpl) mpl.onclick=async()=>{
    mOut('Тяну данные за вчера…');
    const r=await api('POST',{type:'meta_pull'});
    if(!r||r.error){mOut('⚠️ '+(r&&r.error||'ошибка'));return;}
    mOut('✅ Обновлено за '+r.day+'. Перезайди в отчёт.');
  };
  // ---- аналитика ----
  document.querySelectorAll('[data-ansec]').forEach(b=>b.onclick=()=>{AN_SEC=b.dataset.ansec;AN_DATA=null;AN_ERR=null;anLoad();});
  document.querySelectorAll('[data-anproj]').forEach(b=>b.onclick=()=>{AN_PROJ=b.dataset.anproj;AN_DATA=null;AN_ERR=null;anLoad();});
  document.querySelectorAll('[data-ancycle]').forEach(b=>b.onclick=()=>{const[s,u]=cycleDates(+b.dataset.ancycle);AN_SINCE=s;AN_UNTIL=u;anLoad();});
  const ansh=document.querySelector('[data-anshow]'); if(ansh) ansh.onclick=()=>{AN_SINCE=val('anSince')||AN_SINCE;AN_UNTIL=val('anUntil')||AN_UNTIL;anLoad();};
  document.querySelectorAll('[data-metabind]').forEach(b=>b.onclick=async()=>{
    const [key,field]=b.dataset.metabind.split('|');
    const acc=window.META_ACC;
    let hint=field==='ig'?'ID IG-аккаунта':'ID кабинета (act_…)';
    if(acc){hint+='\n\n'+(field==='ig'?(acc.igAccounts||[]).map(a=>`@${a.username}: ${a.ig_id}`).join('\n'):(acc.adAccounts||[]).map(a=>`${a.name}: ${a.id}`).join('\n'));}
    const v=(prompt(hint)||'').trim(); if(!v)return;
    const r=await api('POST',{type:'meta_bind',projectKey:key,field,value:v});
    if(r&&r.map){DATA.meta.map=r.map;render();}
  });
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const[id,toPos]=b.dataset.mv.split(':');act({type:'item_move',id:+id,planId:TBL_PLAN,toPos:+toPos});});
  document.querySelectorAll('[data-daily]').forEach(b=>b.onclick=()=>act({type:'daily_toggle',id:+b.dataset.daily}));
  document.querySelectorAll('[data-daily-del]').forEach(b=>b.onclick=()=>act({type:'daily_delete',id:+b.dataset.dailyDel}));
  const dadd=document.querySelector('[data-daily-add]'); if(dadd) dadd.onclick=async()=>{const title=(val('dailyNew')||'').trim(); if(!title){tg.showAlert&&tg.showAlert('Впиши задачу');return;} await act({type:'daily_add',title,who:val('dailyWho')});};
  // пробел и прочие клавиши не должны перехватываться контейнером Telegram
  document.querySelectorAll('input,textarea').forEach(el=>{el.addEventListener('keydown',e=>e.stopPropagation());el.addEventListener('keypress',e=>e.stopPropagation());});
  document.querySelectorAll('[data-dl]').forEach(inp=>inp.onchange=async()=>{const res=await api('POST',{type:'item_patch',id:+inp.dataset.dl,planId:TBL_PLAN,patch:{deadline:inp.value}}); if(res&&res.error){tg.showAlert&&tg.showAlert(res.error);} if(res&&res.items){TBL_ITEMS=res.items;render();}});
  const tdel=document.querySelector('[data-tdel]'); if(tdel) tdel.onclick=()=>{const del=async()=>{const res=await api('POST',{type:'item_delete',id:TBL_OPEN,planId:TBL_PLAN}); if(res&&res.items)TBL_ITEMS=res.items; TBL_OPEN=null; render();}; if(tg.showConfirm){tg.showConfirm('Удалить пункт?',(ok)=>{if(ok)del();});}else del();};
}

load();
</script>
</body>
</html>
