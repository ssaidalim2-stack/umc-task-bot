}
function finSelect(field,opts,value,attrs){
  return `<select class="rsel" data-ff="${field}" style="width:100%;padding:9px 8px" ${attrs||''}>${opts.map(([k,l])=>`<option value="${esc(String(k))}" ${String(value)===String(k)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
}
function finCurPills(field,value){
  return `<div class="pills" style="padding:2px 0 4px">${[["UZS","сум"],["USD","$"]].map(([k,l])=>`<div class="pill ${value===k?'active':''}" data-ffpill="${field}:${k}">${l}</div>`).join('')}</div>`;
}
function finProjOpts(withGeneral){
  const list=(FIN.projects||[]).filter(p=>!p.archived).map(p=>[p.id,p.name]);
  return withGeneral?[["","Общие (без проекта)"],...list]:list;
}
function finCycleOpts(){ const out=[]; for(let i=-6;i<=2;i++){ const c=finShift(FIN.current,i); out.push([c,finCycleLabel(c)+(i===0?' (текущий)':'')]); } return out; }

function renderFinance(){
  if(DATA.user.role!=='admin') return '<div class="empty">Раздел доступен только админу</div>';
  if(!FIN&&!FIN_LOADING&&!FIN_ERR){ setTimeout(finLoad,0); return umcLoader('Считаю финансы…'); }
  if(FIN_LOADING&&!FIN) return umcLoader('Считаю финансы…');
  if(FIN_ERR&&!FIN) return `<div class="card"><h3>💰 Финансы</h3><div class="muted" style="color:#e5484d">${esc(FIN_ERR)}</div><button class="btn sm" data-finreload style="margin-top:10px">Повторить</button></div>`;
  if(FIN_FORM) return renderFinForm();
  if(FIN_PERSON!=null) return renderFinPerson();
  const r=FIN.rate||{};
  const rateTxt=r.rate?`1$ = ${Math.round(r.rate*100)/100} сум <span class="muted">(${r.source==='manual'?'вручную':'ЦБ'}, ${finDate(r.date)})</span>`:'<span style="color:#e5484d">курс недоступен — задай вручную</span>';
  const head=`<div class="card">
    <div class="row"><h3>💰 Финансы</h3>
      <div class="pills" style="padding:0">${[["USD","$"],["UZS","сум"]].map(([k,l])=>`<div class="pill ${FIN_CUR===k?'active':''}" data-fincur="${k}">${l}</div>`).join('')}</div></div>
    <div class="row" style="margin-top:4px">
      <button class="btn sm sec" data-fincyc="-1">‹</button>
      <div style="text-align:center;flex:1"><b>${finCycleLabel(FIN.cycle)}</b>${FIN.cycle===FIN.current?' <span class="badge">текущий</span>':''}${FIN_LOADING?' <span class="muted">…</span>':''}</div>
      <button class="btn sm sec" data-fincyc="1">›</button>
    </div>
    <div class="muted" style="font-size:12px;margin-top:8px">Курс: ${rateTxt} <button class="xbtn" data-finrate title="Задать курс вручную">✏️</button></div>
  </div>
  <div class="pills">${FIN_SECS.map(([k,l])=>`<div class="pill ${FIN_SEC===k?'active':''}" data-finsec="${k}">${l}</div>`).join('')}</div>`;
  const body=FIN_SEC==='income'?renderFinIncome():FIN_SEC==='expense'?renderFinExpense():FIN_SEC==='team'?renderFinTeam():renderFinOverview();
  return head+body;
}

function renderFinOverview(){
  const E=FIN.entries||[];
  const inc=E.filter(e=>e.kind==='income'), acc=E.filter(e=>e.kind==='accrual'), exp=E.filter(e=>e.kind==='expense'), pay=E.filter(e=>e.kind==='payout');
  const rev=finSum(inc), got=finSum(inc.filter(e=>e.status==='done')), wait=finSum(inc.filter(e=>e.status==='planned'));
  const team=finSum(acc), other=finSum(exp);
  const profit=finAdd(finAdd(rev,team,-1),other,-1);
  const margin=rev.usd?Math.round(profit.usd/rev.usd*100):null;
  const today=finToday();
  const debts=FIN.openIncome||[], overdue=debts.filter(e=>e.due_on&&e.due_on<today);
  // долг перед командой — в родной валюте, без пересчёта курсом
  let owe={UZS:0,USD:0}, adv={UZS:0,USD:0};
  for(const p of FIN.people||[]) for(const c of ['UZS','USD']){ const v=p.balance[c]||0; if(v>0) owe[c]+=v; else if(v<0) adv[c]+=-v; }
  // разрез по проектам: «Общие» — оклады по должности и расходы без проекта
  const keys=new Set(E.filter(e=>e.kind!=='payout').map(e=>e.project_id==null?'g':String(e.project_id)));
  const rows=[...keys].map(k=>{
    const pid=k==='g'?null:+k, mine=E.filter(e=>(e.project_id==null?'g':String(e.project_id))===k);
    const r=finSum(mine.filter(e=>e.kind==='income')), t=finSum(mine.filter(e=>e.kind==='accrual')), x=finSum(mine.filter(e=>e.kind==='expense'));
    return {pid,name:finProjName(pid),r,t,x,p:finAdd(finAdd(r,t,-1),x,-1)};
  }).sort((a,b)=>(a.pid==null)-(b.pid==null)||b.r.usd-a.r.usd);
  const color=v=>v<0?'color:#e5484d':'';
  const table=rows.length?`<div style="overflow-x:auto"><table class="ctab"><tr><th>Проект</th><th>Доход</th><th>Команда</th><th>Расходы</th><th>Прибыль</th></tr>
    ${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${fOne(x.r.uzs,x.r.usd)}</td><td>${fOne(x.t.uzs,x.t.usd)}</td><td>${fOne(x.x.uzs,x.x.usd)}</td><td style="font-weight:700;${color(x.p.usd)}">${fOne(x.p.uzs,x.p.usd)}</td></tr>`).join('')}
    <tr><td>Итого</td><td><b>${fOne(rev.uzs,rev.usd)}</b></td><td><b>${fOne(team.uzs,team.usd)}</b></td><td><b>${fOne(other.uzs,other.usd)}</b></td><td style="font-weight:800;${color(profit.usd)}">${fOne(profit.uzs,profit.usd)}</td></tr></table></div>`
    :'<div class="muted">В этом цикле пока нет ни доходов, ни расходов.</div>';
  const unas=(FIN.unassigned||[]).length;
  return `<div class="fgrid">
  <div class="card">
    <div class="muted">Прибыль за цикл</div>
    <div style="font-size:24px;margin:4px 0;${color(profit.usd)}">${fBoth(profit.uzs,profit.usd)}</div>
    ${margin!=null?`<div class="muted">Маржа: <b>${margin}%</b></div>`:''}
    <div class="vid"><div>💵 Доход по договорам</div><div style="text-align:right">${fBoth(rev.uzs,rev.usd)}</div></div>
    <div class="muted" style="font-size:12px;margin:-4px 0 4px">получено ${fOne(got.uzs,got.usd)} · ждём ${fOne(wait.uzs,wait.usd)}</div>
    <div class="vid"><div>👥 Команда (начислено)</div><div style="text-align:right">${fBoth(team.uzs,team.usd)}</div></div>
    <div class="vid"><div>🧾 Прочие расходы</div><div style="text-align:right">${fBoth(other.uzs,other.usd)}</div></div>
  </div>
  <div class="card">
    <h3>🏦 Деньги сейчас</h3>
    <div class="vid" data-finsec="income" style="cursor:pointer"><div>Клиенты должны нам<div class="muted" style="font-size:12px">оплат: ${debts.length}${overdue.length?` · <span style="color:#e5484d">${overdue.length} просрочено</span>`:''}</div></div><div style="text-align:right">${fBoth(finSum(debts).uzs,finSum(debts).usd)}</div></div>
    <div class="vid" data-finsec="team" style="cursor:pointer"><div>Мы должны команде</div><div style="text-align:right"><b>${fNat(owe)}</b></div></div>
    ${adv.UZS||adv.USD?`<div class="vid" data-finsec="team" style="cursor:pointer"><div>Выдано авансом<div class="muted" style="font-size:12px">ещё не отработано</div></div><div style="text-align:right"><b>${fNat(adv)}</b></div></div>`:''}
    <div class="vid"><div>Получено в этом цикле</div><div style="text-align:right">${fBoth(got.uzs,got.usd)}</div></div>
    <div class="vid"><div>Выплачено команде в цикле</div><div style="text-align:right">${fBoth(finSum(pay).uzs,finSum(pay).usd)}</div></div>
  </div>
  </div>
  ${unas?`<div class="card" data-finsec="team" style="cursor:pointer;border-color:#f5a524"><b>⚠️ ${unas} начислени${unas===1?'е':'я'} без исполнителя</b><div class="muted" style="font-size:12px">Бот не понял, кто снимал/монтировал. Открой «Зарплаты» и выбери человека.</div></div>`:''}
  <div class="card"><h3>📁 По проектам</h3>${table}
    <div class="muted" style="font-size:11px;margin-top:8px">Прибыль = доход цикла − начисления команде − расходы. Выплаты и авансы прибыль не меняют — они гасят долг перед человеком.</div></div>`;
}

function finEntryRow(e,opts){
  opts=opts||{};
  const today=finToday();
  const st=e.kind==='income'
    ? (e.status==='planned'?(e.due_on&&e.due_on<today?'<span class="badge" style="background:#e5484d;color:#fff">просрочено</span>':'<span class="badge" style="background:#f5a524;color:#fff">ожидается</span>'):'<span class="badge" style="background:#2ea043;color:#fff">получено</span>')
    : '';
  const sub=[opts.who?finPersonName(e.member_id):'', opts.proj!==false?finProjName(e.project_id):'', finCatLabel(e.kind,e.category),
    e.status==='planned'&&e.due_on?'до '+finDate(e.due_on):(e.paid_on?finDate(e.paid_on):''), opts.cyc?finCycleLabel(e.cycle):''].filter(Boolean).join(' · ');
  return `<div class="vid" data-finopen="${e.id}" style="cursor:pointer;align-items:flex-start">
    <div style="min-width:0;flex:1"><div>${esc(e.note||finCatLabel(e.kind,e.category))}</div><div class="muted" style="font-size:12px">${esc(sub)}</div></div>
    <div style="text-align:right;flex:0 0 auto"><b style="${e.amount<0?'color:#e5484d':''}">${fNative(e.amount,e.currency)}</b>${e.currency==='USD'?`<div class="muted" style="font-size:11px">${fUZS(e.uzs)}</div>`:`<div class="muted" style="font-size:11px">${fUSD(e.usd)}</div>`}
      ${st?`<div style="margin-top:3px">${st}</div>`:''}
      ${opts.pay&&e.status==='planned'?`<button class="btn xs" data-finpay="${e.id}" style="margin-top:5px">✅ Получено</button>`:''}</div>
  </div>`;
}

function renderFinIncome(){
  const debts=FIN.openIncome||[];
  const inc=(FIN.entries||[]).filter(e=>e.kind==='income');
  const terms=new Map((FIN.terms||[]).map(t=>[t.project_id,t]));
  const termRows=(FIN.projects||[]).filter(p=>!p.archived).map(p=>{
    const t=terms.get(p.id);
    const txt=t&&t.active&&t.fee>0?`${fNative(t.fee,t.currency)} за цикл · ${finSchedLabel(t.schedule)}`:'<span class="muted">условия не заданы</span>';
    return `<div class="vid" data-finterms="${p.id}" style="cursor:pointer"><div><b>${esc(p.name)}</b><div class="muted" style="font-size:12px">${txt}</div></div><span class="muted">✏️</span></div>`;
  }).join('');
  return `<div class="fgrid">
  <div class="card"><div class="row"><h3>⏳ Ждём оплату</h3><span class="muted">${fBoth(finSum(debts).uzs,finSum(debts).usd)}</span></div>
    ${debts.length?debts.map(e=>finEntryRow(e,{pay:true,cyc:e.cycle!==FIN.cycle})).join(''):'<div class="muted">Все клиенты рассчитались 🎉</div>'}</div>
  <div class="card"><div class="row"><h3>💵 Доходы цикла</h3><button class="btn sm" data-finnew="income">＋ Доход</button></div>
    ${inc.length?inc.map(e=>finEntryRow(e)).join(''):'<div class="muted">В этом цикле доходов нет.</div>'}
    <div class="muted" style="font-size:11px;margin-top:8px">Доход относится к циклу работы, а не к дню оплаты: предоплата 50% и доплата через месяц — это доход одного цикла.</div></div>
  </div>
  <div class="card"><h3>📄 Условия клиентов</h3>${termRows||'<div class="muted">Нет активных проектов.</div>'}
    <div class="muted" style="font-size:11px;margin-top:8px">По условиям бот сам ставит ожидаемые оплаты в начале каждого цикла и напоминает тебе в 9:00, когда срок наступил. «Вручную / частями» — для разовых и нестандартных договоров: оплаты вносишь сам через «＋ Доход».</div></div>`;
}

function renderFinExpense(){
  const exp=(FIN.entries||[]).filter(e=>e.kind==='expense');
  const byCat={};
  for(const e of exp){ (byCat[e.category]||(byCat[e.category]=[])).push(e); }
  const cats=Object.keys(byCat).map(k=>({k,s:finSum(byCat[k])})).sort((a,b)=>b.s.usd-a.s.usd);
  return `<div class="fgrid">
  <div class="card"><div class="row"><h3>🧾 Расходы цикла</h3><button class="btn sm" data-finnew="expense">＋ Расход</button></div>
    ${exp.length?exp.map(e=>finEntryRow(e)).join(''):'<div class="muted">Расходов в этом цикле нет.</div>'}</div>
  <div class="card"><h3>По категориям</h3>
    ${cats.length?cats.map(c=>`<div class="vid"><div>${esc(finCatLabel('expense',c.k))}</div><div style="text-align:right">${fBoth(c.s.uzs,c.s.usd)}</div></div>`).join(''):'<div class="muted">—</div>'}
    <div class="muted" style="font-size:11px;margin-top:8px">Зарплаты сюда не входят — они во вкладке «Зарплаты». Подписка с ценой сама пишет расход при покупке и продлении.</div></div>
  </div>`;
}

function finRuleText(r){
  const proj=r.project_id?' · '+finProjName(r.project_id):(['shoot','edit','graphic'].includes(r.kind)?' · все проекты':'');
  return `${finRuleLabel(r.kind)}${r.title?' ('+esc(r.title)+')':''}${esc(proj)}: <b>${fNative(r.amount,r.currency)}</b>`;
}
function finBalanceText(b){
  const parts=[];
  for(const c of ['USD','UZS']){ const v=b[c]||0; if(Math.abs(v)>=0.01) parts.push(v>0?`<span>должны ${fNative(v,c)}</span>`:`<span style="color:#2ea6ff">аванс ${fNative(-v,c)}</span>`); }
  return parts.join(' · ')||'<span class="muted">в расчёте</span>';
}
function renderFinTeam(){
  const E=FIN.entries||[];
  const unas=FIN.unassigned||[];
  const people=(FIN.people||[]).map(p=>{
    const rules=(FIN.rules||[]).filter(r=>r.member_id===p.id);
    const accL=E.filter(e=>e.kind==='accrual'&&e.member_id===p.id), paidL=E.filter(e=>e.kind==='payout'&&e.member_id===p.id);
    const acc=finNat(accL), paid=finNat(paidL);
    const bal=p.balance||{};
    const active=rules.length||accL.length||paidL.length||Math.abs(bal.UZS||0)>0.01||Math.abs(bal.USD||0)>0.01;
    return {p,rules,acc,paid,bal,active};
  });
  const row=x=>`<div class="vid" data-finperson="${x.p.id}" style="cursor:pointer;align-items:flex-start">
    <div style="min-width:0;flex:1"><b>${esc(x.p.name)}</b>
      <div class="muted" style="font-size:12px">${x.rules.length?x.rules.map(r=>finRuleLabel(r.kind)).filter((v,i,a)=>a.indexOf(v)===i).join(', '):'схема оплаты не задана'}</div>
      <div style="font-size:12px;margin-top:2px">${finBalanceText(x.bal)}</div></div>
    <div style="text-align:right;flex:0 0 auto;font-size:13px"><div>начислено <b>${fNat(x.acc)}</b></div><div class="muted">выплачено ${fNat(x.paid)}</div></div>
  </div>`;
  const on=people.filter(x=>x.active), off=people.filter(x=>!x.active);
  const unasHtml=unas.length?`<div class="card" style="border-color:#f5a524"><h3>⚠️ Кому начислить?</h3>
    <div class="muted" style="font-size:12px;margin-bottom:6px">Работа сделана, но бот не понял, кто её делал (ТЗ не уходило конкретному человеку, а людей с этой ролью несколько).</div>
    ${unas.map(e=>`<div class="vid"><div style="min-width:0;flex:1">${esc(e.note||'')}<div class="muted" style="font-size:12px">${finCycleLabel(e.cycle)}</div></div>
      <select class="rsel" data-finassign="${e.id}" style="max-width:170px"><option value="">выбрать…</option>${(FIN.people||[]).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>`).join('')}</div>`:'';
  return `${unasHtml}<div class="card"><div class="row"><h3>👥 Зарплаты</h3><span class="muted" style="font-size:12px">${finCycleLabel(FIN.cycle)}</span></div>
    ${on.length?on.map(row).join(''):'<div class="muted">Пока ни у кого не задана схема оплаты. Нажми на человека ниже.</div>'}
    ${off.length?`<div class="muted" style="margin:12px 0 2px;font-size:12px">Без схемы оплаты:</div>${off.map(row).join('')}`:''}
    <div class="muted" style="font-size:11px;margin-top:8px">Должны — начислено больше, чем выплачено (за всё время). Аванс — выдано больше, чем начислено. Сдельная оплата начисляется сама, когда видео отмечено «Снято» / «Смонтировано», а графика — «Готово».</div></div>`;
}

function renderFinPerson(){
  const p=(FIN.people||[]).find(x=>x.id==FIN_PERSON);
  if(!p){ FIN_PERSON=null; return renderFinance(); }
  const rules=(FIN.rules||[]).filter(r=>r.member_id===p.id);
  const E=(FIN.entries||[]).filter(e=>e.member_id===p.id);
  const acc=E.filter(e=>e.kind==='accrual'), pay=E.filter(e=>e.kind==='payout');
  return `<div class="card">
    <div class="row"><h3>${esc(p.name)}</h3><button class="btn sm sec" data-finback>← назад</button></div>
    <div style="font-size:18px;margin:4px 0">${finBalanceText(p.balance||{})}</div>
    <div class="row" style="gap:6px;flex-wrap:wrap;justify-content:flex-start;margin-top:8px">
      <button class="btn sm" data-finnew="payout" data-finwho="${p.id}">💸 Выплата / аванс</button>
      <button class="btn sm sec" data-finnew="accrual" data-finwho="${p.id}" data-fincat="bonus">＋ Премия</button>
      <button class="btn sm sec" data-finnew="accrual" data-finwho="${p.id}" data-fincat="deduction">− Вычет</button>
    </div>
  </div>
  <div class="fgrid">
  <div class="card"><div class="row"><h3>⚙️ Схема оплаты</h3><button class="btn sm" data-finrule="new">＋ Добавить</button></div>
    ${rules.length?rules.map(r=>`<div class="vid"><div style="min-width:0;flex:1;cursor:pointer" data-finrule="${r.id}">${finRuleText(r)}</div><button class="xbtn" data-finruledel="${r.id}" title="Убрать">✕</button></div>`).join(''):'<div class="muted">Не задана. Добавь оклад по должности, фикс за проект или сдельные ставки — их можно совмещать.</div>'}
    <div class="muted" style="font-size:11px;margin-top:8px">Оклад и фикс за проект начисляются сами в начале каждого цикла. Сдельные ставки — за каждое снятое/смонтированное видео и готовую графику; ставка конкретного проекта важнее общей.</div></div>
  <div class="card"><h3>📒 ${finCycleLabel(FIN.cycle)}</h3>
    <div class="muted" style="margin-bottom:2px">Начислено: <b>${fNat(finNat(acc))}</b></div>
    ${acc.map(e=>finEntryRow(e)).join('')||'<div class="muted" style="font-size:12px">начислений нет</div>'}
    <div class="muted" style="margin:10px 0 2px">Выплачено: <b>${fNat(finNat(pay))}</b></div>
    ${pay.map(e=>finEntryRow(e,{proj:false})).join('')||'<div class="muted" style="font-size:12px">выплат нет</div>'}</div>
  </div>`;
}

function renderFinForm(){
  const f=FIN_FORM;
  const back=`<button class="btn sm sec" data-finclose>← назад</button>`;
  if(f.mode==='rate'){
    return `<div class="card"><div class="row"><h3>Курс доллара</h3>${back}</div>
      <div class="muted">Сколько сум за 1$ (на сегодня). Обычно курс берётся из ЦБ сам — вручную нужно, только если ЦБ недоступен или нужен другой курс.</div>
      <input data-ff="rate" value="${esc(String(f.rate||''))}" inputmode="decimal" placeholder="напр. 12650" style="margin-top:8px">
      <button class="btn full" data-finsave>💾 Сохранить</button>
      <button class="btn sm sec full" data-finrateclear style="margin-top:6px">Вернуть курс ЦБ</button></div>`;
  }
  if(f.mode==='pay'){
    return `<div class="card"><div class="row"><h3>Оплата получена</h3>${back}</div>
      <div class="muted">${esc(finProjName(f.project_id))} · ожидалось <b>${fNative(f.expected,f.expCur)}</b></div>
      <div class="muted" style="margin-top:8px">Сколько пришло:</div><input data-ff="amount" value="${esc(String(f.amount))}" inputmode="decimal">
      ${finCurPills('currency',f.currency)}
      <div class="muted">Дата:</div><input type="date" data-ff="paid_on" value="${esc(f.paid_on)}">

  }
  if(f.mode==='terms'){
    return `<div class="card"><div class="row"><h3>Условия: ${esc(finProjName(f.projectId))}</h3>${back}</div>

      <div class="muted" style="font-size:11px;margin-top:6px">Изменения применяются к текущему циклу, если по нему ещё ничего не оплачено, и ко всем следующим. Уже полученные деньги не трогаются.</div>
      <button class="btn full" data-finsave>💾 Сохранить</button></div>`;
  }
  if(f.mode==='rule'){

      <div class="pills" style="flex-wrap:wrap">${FIN_RULE_KINDS.map(([k,l])=>`<div class="pill ${f.kind===k?'active':''}" data-ffpill="kind:${k}">${l}</div>`).join('')}</div>

      ${f.kind!=='salary'?`<div class="muted">Проект:</div>${finSelect('project_id',piece?[["","Все проекты"],...finProjOpts(false)]:finProjOpts(false),f.project_id)}`:''}
      <div class="muted" style="margin-top:6px">${f.kind==='salary'||f.kind==='project_fixed'?'Сумма за цикл:':'Ставка за единицу:'}</div>
      <input data-ff="amount" value="${esc(String(f.amount||''))}" inputmode="decimal" placeholder="0">
      ${finCurPills('currency',f.currency)}
      <button class="btn full" data-finsave>💾 Сохранить</button></div>`;

  // запись журнала: доход / расход / начисление / выплата
  const k=f.kind;
  const auto=!!f.ref;
  const cats=(FIN_CAT[k]||[]).filter(([c])=>auto||!['salary','project_fixed','shoot','edit','graphic'].includes(c)||k==='payout');
  const catHtml=k==='payout'?'':auto?`<div class="muted">Тип: <b>${esc(finCatLabel(k,f.category))}</b> <span class="badge">авто</span></div>`
    :`<div class="muted">Тип:</div><div class="pills" style="flex-wrap:wrap">${cats.map(([c,l])=>`<div class="pill ${f.category===c?'active':''}" data-ffpill="category:${c}">${l}</div>`).join('')}</div>`;
  const who=(k==='accrual'||k==='payout')?`<div class="muted">Сотрудник:</div>${finSelect('member_id',[["","выбрать…"],...(FIN.people||[]).map(p=>[p.id,p.name])],f.member_id||'')}`:'';
  const proj=k==='payout'?'':`<div class="muted" style="margin-top:6px">Проект:</div>${finSelect('project_id',finProjOpts(true),f.project_id==null?'':f.project_id)}`;
  const statusHtml=k==='income'?`<div class="pills">${[["done","✅ Получено"],["planned","⏳ Ожидается"]].map(([s,l])=>`<div class="pill ${f.status===s?'active':''}" data-ffpill="status:${s}">${l}</div>`).join('')}</div>`:'';
  const dateHtml=k==='income'&&f.status==='planned'
    ? `<div class="muted">Ожидается до:</div><input type="date" data-ff="due_on" value="${esc(f.due_on||'')}">`
    : `<div class="muted">Дата ${k==='expense'?'расхода':k==='payout'?'выплаты':k==='income'?'оплаты':''}:</div><input type="date" data-ff="paid_on" value="${esc(f.paid_on||finToday())}">`;
  const cycHtml=(k==='income'||k==='accrual')?`<div class="muted" style="margin-top:6px">За какой цикл:</div>${finSelect('cycle',finCycleOpts(),f.cycle)}`:'';
  return `<div class="card"><div class="row"><h3>${f.id?'':'Новый: '}${FIN_KIND_TITLE[k]}</h3>${back}</div>
    ${statusHtml}${catHtml}${who}${proj}
    <div class="muted" style="margin-top:6px">Сумма${f.category==='deduction'?' вычета':''}:</div><input data-ff="amount" value="${esc(String(f.amount===''||f.amount==null?'':Math.abs(f.amount)))}" inputmode="decimal" placeholder="0">
    ${finCurPills('currency',f.currency)}
    ${k==='accrual'?'':dateHtml}${cycHtml}
    <div class="muted" style="margin-top:6px">Комментарий:</div><input data-ff="note" value="${esc(f.note||'')}" placeholder="${k==='payout'?'напр. аванс за октябрь':k==='expense'?'напр. аренда студии':''}">
    <button class="btn full" data-finsave style="margin-top:10px">💾 Сохранить</button>
    ${f.id?`<button class="btn sm sec full" data-findel style="margin-top:6px">🗑 Удалить</button>`:''}
  </div>`;
}

function finOpenEntry(id){
  const all=[...(FIN.entries||[]),...(FIN.openIncome||[]),...(FIN.unassigned||[])];
  const e=all.find(x=>x.id==id); if(!e) return;
  FIN_FORM={mode:'entry',...e};
  render();
}
function finNewEntry(kind,memberId,cat){
  const def={income:'fee',expense:'other',accrual:'bonus',payout:'salary'}[kind];
  FIN_FORM={mode:'entry',kind,category:cat||def,project_id:null,member_id:memberId||'',cycle:FIN.cycle,amount:'',
    currency:kind==='income'?'USD':'UZS',status:'done',due_on:'',paid_on:finToday(),note:''};
  render();
}
async function finSave(){
  finCapture();
  const f=FIN_FORM;
  let ok=false;
  if(f.mode==='rate') ok=await finAct({type:'fin_set_rate',rate:f.rate});
  else if(f.mode==='pay') ok=await finAct({type:'fin_income_pay',id:f.id,amount:f.amount,currency:f.currency,paid_on:f.paid_on,note:f.note});
  else if(f.mode==='terms') ok=await finAct({type:'fin_terms_save',projectId:f.projectId,fields:{fee:f.fee,currency:f.currency,schedule:f.schedule,active:!!f.active}});
  else if(f.mode==='rule') ok=await finAct({type:'fin_rule_save',id:f.id||null,fields:{member_id:f.member_id,kind:f.kind,project_id:f.project_id||null,amount:f.amount,currency:f.currency,title:f.title||''}});
  else ok=await finAct({type:'fin_entry_save',id:f.id||null,fields:{kind:f.kind,category:f.category,project_id:f.project_id||null,member_id:f.member_id||null,
    cycle:f.cycle,amount:f.amount,currency:f.currency,status:f.status,due_on:f.due_on,paid_on:f.paid_on,note:f.note}});
  if(ok){ FIN_FORM=null; render(); }
}
function finBind(){

    render();
  });
  q('[data-finruledel]').forEach(b=>b.onclick=()=>{
    tg.showConfirm?tg.showConfirm('Убрать это правило оплаты? Уже начисленное останется.',async ok=>{ if(ok&&await finAct({type:'fin_rule_delete',id:+b.dataset.finruledel})) render(); })
      :finAct({type:'fin_rule_delete',id:+b.dataset.finruledel}).then(render);
  });
  q('[data-finassign]').forEach(s=>s.onchange=async()=>{ if(!s.value) return; if(await finAct({type:'fin_assign',id:+s.dataset.finassign,memberId:+s.value})) render(); });
  const cl=one('[data-finclose]'); if(cl) cl.onclick=()=>{FIN_FORM=null;render();};
  q('[data-ffpill]').forEach(b=>b.onclick=()=>{
    finCapture();
    const i=b.dataset.ffpill.indexOf(':');
    FIN_FORM[b.dataset.ffpill.slice(0,i)]=b.dataset.ffpill.slice(i+1);
    render();
  });
  const sv=one('[data-finsave]'); if(sv) sv.onclick=()=>busyClick(sv,finSave);
  const dl=one('[data-findel]'); if(dl) dl.onclick=()=>{
    const go=async()=>{ if(await finAct({type:'fin_entry_delete',id:FIN_FORM.id})){FIN_FORM=null;render();} };
    tg.showConfirm?tg.showConfirm('Удалить запись?',ok=>{ if(ok) go(); }):go();
  };
}

    if(tg.showConfirm){tg.showConfirm('Удалить период и ВСЕ пункты в нём? Это необратимо.',(ok)=>{if(ok)del();});}else del();
  });
  const npc=document.querySelector('[data-np-create]'); if(npc) npc.onclick=async()=>{const period=(val('np_name')||'').trim(); if(!period){tg.showAlert&&tg.showAlert('Введите название периода');return;} const videos=parseInt(val('np_videos'))||0, graphics=parseInt(val('np_graphics'))||0; const res=await api('POST',{type:'plan_create',projectId:TBL_PROJ,period,videos,graphics}); if(res&&res.projects){DATA=res;} TBL_NEWPERIOD=false;TBL_PLAN=null;TBL_LOADED=null; render(); tg.showAlert&&tg.showAlert('Период создан ✅');};
  document.querySelectorAll('[data-topen]').forEach(b=>b.onclick=()=>{
    TBL_OPEN=+b.dataset.topen; UNDO=[]; clearTimeout(AS_TIMER);
    const it=(TBL_ITEMS||[]).find(x=>x.id==TBL_OPEN); AS_STATE=it?itemFingerprint(it):'';
    render();
  });
  const tclose=document.querySelector('[data-tclose]'); if(tclose) tclose.onclick=async()=>{
    clearTimeout(AS_TIMER); await runAutosave(true);   // не терять недописанное при выходе
    TBL_OPEN=null; UNDO=[]; render();
  };
  document.querySelectorAll('[data-titype]').forEach(b=>b.onclick=()=>{const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(it){captureFields(it); it.type=b.dataset.titype; if(!STATUS_OPTS(it.type).some(s=>s[0]==it.stage)) it.stage=STATUS_OPTS(it.type)[0][0];} render(); scheduleAutosave();});
  document.querySelectorAll('[data-tflag]').forEach(b=>b.onchange=()=>{const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(!it) return; captureFields(it);
    it[b.dataset.tflag]=b.checked;
    if(it.target_only) it.no_shoot=true;            // только таргет — всегда без съёмки
    if(it.no_shoot){ it.shoot_date=''; if(it.stage==='shoot') it.stage='edit'; }
    render(); scheduleAutosave();});
  document.querySelectorAll('[data-tstatus]').forEach(b=>b.onclick=()=>{const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(it){captureFields(it); it.stage=b.dataset.tstatus;} render(); scheduleAutosave();});
  document.querySelectorAll('[data-tlang]').forEach(b=>b.onclick=()=>{const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(it){captureFields(it); it.lang=(it.lang===b.dataset.tlang?'':b.dataset.tlang);} render(); scheduleAutosave();});
  document.querySelectorAll('[data-tformat]').forEach(b=>b.onclick=()=>{const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(it){captureFields(it); it.format=(it.format===b.dataset.tformat?'':b.dataset.tformat);} render(); scheduleAutosave();});
  document.querySelectorAll('[data-tadd]').forEach(b=>b.onclick=()=>act({type:'item_add',planId:TBL_PLAN,projectId:TBL_PROJ,itemType:b.dataset.tadd}));
  document.querySelectorAll('[data-tview]').forEach(b=>b.onclick=()=>{TBL_VIEW=b.dataset.tview;try{localStorage.setItem('umc_tbl_view',TBL_VIEW);}catch(e){}render();});
  document.querySelectorAll('[data-tlock]').forEach(b=>b.onclick=()=>act({type:'item_lock',id:+b.dataset.tlock,planId:TBL_PLAN}));
  const tsave=document.querySelector('[data-tsave]'); if(tsave) tsave.onclick=()=>busyClick(tsave, async()=>{const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); captureFrames(it); if(document.getElementById('f_script')) it.script=val('f_script'); const newPos=parseInt(val('f_pos'))||it.idx; captureFields(it); const fields=autosaveFields(it); let res=await api('POST',{type:'item_update',id:it.id,planId:TBL_PLAN,fields}); if(res&&res.error){tg.showAlert&&tg.showAlert(res.error); if(res.items)TBL_ITEMS=res.items; render(); return;} if(newPos!==it.idx){ res=await api('POST',{type:'item_move',id:it.id,planId:TBL_PLAN,toPos:newPos}); } if(res&&res.items)TBL_ITEMS=res.items; TBL_OPEN=null; render();});
  const tzsend=document.querySelector('[data-tzsend]'); if(tzsend) tzsend.onclick=()=>busyClick(tzsend, async()=>{
    const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(!it) return;
    captureFields(it);
    const theme=it.theme||'', script=it.script||'', reference=it.reference||'', props=it.props||'', deadline=it.deadline||'';
    if(!theme.trim()||!script.trim()){tg.showAlert&&tg.showAlert('Заполни тему и текст/сценарий перед отправкой ТЗ');return;}
    if(!deadline.trim()){tg.showAlert&&tg.showAlert('Укажи дедлайн — бот подставит его в ТЗ автоматически');return;}
    const fields=autosaveFields(it);
    let res=await api('POST',{type:'item_update',id:it.id,planId:TBL_PLAN,fields});
    if(res&&res.error){tg.showAlert&&tg.showAlert(res.error); if(res.items)TBL_ITEMS=res.items; render(); return;}
    if(res&&res.items)TBL_ITEMS=res.items;
    // тот же формат, что и у кнопки «Копировать» — единый вид ТЗ везде
    const fresh={...it};
    const lines=[buildFullScriptText(fresh)];
    const section=it.type==='video'?'edit':'design';
    await act({type:'tz',section,execId:null,projectId:TBL_PROJ,itemId:it.id,deadline,text:lines.join('\n')});
    tg.showAlert&&tg.showAlert('ТЗ отправлено ✅');
  });
  const airaska=document.querySelector('[data-airaska]'); if(airaska) airaska.onclick=async()=>{
    const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(!it) return;
    captureFrames(it); if(document.getElementById('f_script')) it.script=val('f_script');
    const script=it.script||'';
    if(!script.trim()){tg.showAlert&&tg.showAlert('Сначала заполни сценарий');return;}
    captureFields(it); const fields=autosaveFields(it);
    await api('POST',{type:'item_update',id:it.id,planId:TBL_PLAN,fields});
    const prevTxt=airaska.textContent; airaska.textContent='⏳ Генерирую раскадровку…'; airaska.disabled=true;
    const res=await api('POST',{type:'item_ai_tz',id:it.id,planId:TBL_PLAN,script});
    airaska.textContent=prevTxt; airaska.disabled=false;
    if(res&&res.items)TBL_ITEMS=res.items;
    if(res&&res.error){tg.showAlert&&tg.showAlert(res.error);} else {tg.showAlert&&tg.showAlert('Раскадровка готова ✅');}
    render();
  };
  const aicopy=document.querySelector('[data-aicopy]'); if(aicopy) aicopy.onclick=async()=>{
    const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(!it||!it.ai_tz) return;
    const ok=await copyText(formatAiTzPlain(it.ai_tz)); haptic();
    tg.showAlert&&tg.showAlert(ok?'Скопировано в буфер ✅':'Не удалось скопировать');
  };
  // ---- редактор сценария по кадрам ----
  const _ci=()=>TBL_ITEMS.find(x=>x.id==TBL_OPEN);
  const fmut=(fn)=>{const it=_ci(); if(!it)return; captureFields(it); if(!it.frames)it.frames=[]; fn(it); render(); scheduleAutosave();};
  document.querySelectorAll('[data-fnew]').forEach(b=>b.onclick=()=>fmut(it=>{const k=b.dataset.fnew,fr={kind:k,rows:[]}; k==='hook'?it.frames.unshift(fr):it.frames.push(fr);}));
  document.querySelectorAll('[data-fins]').forEach(b=>b.onclick=()=>fmut(it=>it.frames.splice(+b.dataset.fins+1,0,{kind:'frame',rows:[]})));
  document.querySelectorAll('[data-fup]').forEach(b=>b.onclick=()=>fmut(it=>{const i=+b.dataset.fup; if(i>0){const[f]=it.frames.splice(i,1);it.frames.splice(i-1,0,f);}}));
  document.querySelectorAll('[data-fdn]').forEach(b=>b.onclick=()=>fmut(it=>{const i=+b.dataset.fdn; if(i<it.frames.length-1){const[f]=it.frames.splice(i,1);it.frames.splice(i+1,0,f);}}));
  document.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=()=>fmut(it=>it.frames.splice(+b.dataset.fdel,1)));
  document.querySelectorAll('[data-finsert]').forEach(b=>b.onclick=()=>fmut(it=>{
    const[fi,role]=b.dataset.finsert.split(':');
    const fr=it.frames[+fi]; const cur=frameText(fr);
    fr.text=(cur?cur+' ':'')+role+': ';
  }));
  document.querySelectorAll('[data-frole2]').forEach(b=>b.onclick=()=>{
    const name=(prompt('Название роли (напр. Голос, Локация, Актёр):')||'').trim();
    if(name) fmut(it=>{const fi=+b.dataset.frole2; const fr=it.frames[fi]; const cur=frameText(fr); fr.text=(cur?cur+' ':'')+name+': ';});
  });
  const copyBtn=document.querySelector('[data-copyscript]'); if(copyBtn) copyBtn.onclick=async()=>{
    const it=TBL_ITEMS.find(x=>x.id==TBL_OPEN); if(!it) return;
    captureFields(it);
    const text=buildFullScriptText(it);
    if(!text.trim()){ tg.showAlert&&tg.showAlert('Сценарий пуст — нечего копировать'); return; }
    const ok=await copyText(text); haptic();
    tg.showAlert&&tg.showAlert(ok?'Скопировано в буфер ✅':'Не удалось скопировать');
  };
  // ---- Meta (IG + Ads) ----
  const mOut=(t)=>{const e=document.getElementById('metaOut'); if(e)e.textContent=t;};
  const mst=document.querySelector('[data-metastatus]'); if(mst) mst.onclick=async()=>{
    mOut('Проверяю токен…');
    const r=await api('POST',{type:'meta_status'});
    if(!r){mOut('⚠️ ошибка');return;}
    if(!r.configured){mOut('Токен не задан (META_TOKEN).');return;}
    if(r.error){
      // показываем настоящую причину, а не «аккаунтов нет»
      mOut('❌ Токен не работает\n\n'+r.error+'\n\nЧто делать: выпусти новый токен (лучше бессрочный, системного пользователя) и вставь его кнопкой 🔑 Токен.');
      return;
    }
    if(r.token&&r.token.ok){
      mOut(metaTokenText(r.token)+'\n\nЗагружаю аккаунты…');
    }
    let s='Instagram-аккаунты:\n'+(r.igAccounts||[]).map(a=>`@${a.username} (${a.src||''}) — id ${a.ig_id}`).join('\n');
    s+='\n\nРекламные кабинеты:\n'+(r.adAccounts||[]).map(a=>`${a.name}${a.src?' ('+a.src+')':''} — ${a.id}`).join('\n');
    for(const b of (r.businesses||[])){
      s+=`\n\n🏢 ${b.name}:`;
      for(const p of (b.pages||[])) s+=`\n  стр. ${p.name}${p.ig?` · IG @${p.ig.username} — ${p.ig.id}`:''}`;
      for(const a of (b.adAccounts||[])) s+=`\n  кабинет ${a.name} — ${a.id}`;
    }
    s+='\n\nПривязка: кнопки IG/Ads у проекта ниже.';
    mOut(s);
    // после загрузки списка — дорисуем кнопки привязки
    window.META_ACC=r;
  };
  const mto=document.querySelector('[data-metatokopen]'); if(mto) mto.onclick=()=>{META_TOK_OPEN=!META_TOK_OPEN;render();};
  const mts=document.querySelector('[data-metatoken]'); if(mts) mts.onclick=()=>busyClick(mts, async()=>{
    const token=(val('metaTok')||'').trim();
    if(!token){tg.showAlert&&tg.showAlert('Вставь токен');return;}
    mOut('Проверяю токен в Meta…');
    const r=await api('POST',{type:'meta_set_token',token});
    if(!r||!r.token||!r.token.ok){ mOut('❌ Токен не сохранён — Meta его не принимает:\n\n'+((r&&r.error)||'ошибка')); return; }
    const was=DATA.meta&&DATA.meta.configured;
    META_TOK_OPEN=false;
    if(!was){ await load(); }
    else render();
    mOut('💾 Сохранено.\n'+metaTokenText(r.token));
  });
  const aic=document.querySelector('[data-aicheck]'); if(aic) aic.onclick=()=>busyClick(aic, async()=>{
    const o=document.getElementById('aiOut'); if(o) o.textContent='Спрашиваю Gemini…';
    let r=null; try{ r=await api('POST',{type:'ai_check'}); }catch(e){}
    const a=r&&r.ai;
    const t=!a?'⚠️ нет ответа от сервера':a.ok?`✅ AI работает — модель ${a.model}`:`❌ AI не работает${a.model?' (модель '+a.model+')':''}\n\n${a.error}`;
    const o2=document.getElementById('aiOut'); if(o2) o2.textContent=t;
  });
  document.querySelectorAll('[data-briefopen]').forEach(b=>b.onclick=()=>{const id=+b.dataset.briefopen;PROJ_BRIEF_OPEN=(PROJ_BRIEF_OPEN===id?null:id);render();});
  document.querySelectorAll('[data-briefsave]').forEach(b=>b.onclick=()=>busyClick(b, async()=>{
    const brief={}; document.querySelectorAll('[data-brief]').forEach(i=>brief[i.dataset.brief]=i.value);
    const r=await api('POST',{type:'project_set_brief',id:+b.dataset.briefsave,brief});
    if(r&&r.error){tg.showAlert&&tg.showAlert(r.error);return;}
    if(r&&r.projects){DATA=r;} tg.showAlert&&tg.showAlert('Бриф сохранён'); render();
  }));
  document.querySelectorAll('[data-ideaspreview]').forEach(b=>b.onclick=()=>busyClick(b, async()=>{
    const id=+b.dataset.ideaspreview;
    PROJ_IDEAS[id]='⏳ Gemini ищет новости и придумывает идеи — до минуты…'; render();
    let r=null; try{ r=await api('POST',{type:'ideas_preview',id}); }catch(e){}
    PROJ_IDEAS[id]=!r?'⚠️ нет ответа от сервера':r.error?('❌ '+r.error):(r.ideasPreview+'\n\n(модель '+r.model+'; это пример — в рассылку не попадает)');
    render();
  }));
  const mpl=document.querySelector('[data-metapull]'); if(mpl) mpl.onclick=async()=>{
    mOut('Тяну данные за вчера…');
    const r=await api('POST',{type:'meta_pull'});
    if(!r||r.error){mOut('⚠️ '+(r&&r.error||'ошибка'));return;}
    mOut('✅ Обновлено за '+r.day+'. Перезайди в отчёт.');
  };
  // ---- аналитика ----
  document.querySelectorAll('[data-ansec]').forEach(b=>b.onclick=()=>{AN_SEC=b.dataset.ansec;AN_DATA=null;AN_ERR=null;anLoad();});
  document.querySelectorAll('[data-anproj]').forEach(b=>b.onclick=()=>{AN_PROJ=b.dataset.anproj;AN_DATA=null;AN_ERR=null;anLoad();});
  document.querySelectorAll('[data-ancycle]').forEach(b=>b.onclick=()=>{const[s,u]=cycleDates(+b.dataset.ancycle);AN_SINCE=s;AN_UNTIL=u;anLoad();});
  const ansh=document.querySelector('[data-anshow]'); if(ansh) ansh.onclick=()=>{AN_SINCE=val('anSince')||AN_SINCE;AN_UNTIL=val('anUntil')||AN_UNTIL;anLoad();};
  document.querySelectorAll('[data-metabind]').forEach(b=>b.onclick=async()=>{
    const [key,field]=b.dataset.metabind.split('|');
    const acc=window.META_ACC;
    let hint=field==='ig'?'ID IG-аккаунта':'ID кабинета (act_…)';
    if(acc){hint+='\n\n'+(field==='ig'?(acc.igAccounts||[]).map(a=>`@${a.username}: ${a.ig_id}`).join('\n'):(acc.adAccounts||[]).map(a=>`${a.name}: ${a.id}`).join('\n'));}
    const v=(prompt(hint)||'').trim(); if(!v)return;
    const r=await api('POST',{type:'meta_bind',projectKey:key,field,value:v});
    if(r&&r.map){DATA.meta.map=r.map;render();}
  });
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const[id,toPos]=b.dataset.mv.split(':');act({type:'item_move',id:+id,planId:TBL_PLAN,toPos:+toPos});});
  document.querySelectorAll('[data-daily]').forEach(b=>b.onclick=()=>act({type:'daily_toggle',id:+b.dataset.daily}));
  document.querySelectorAll('[data-daily-del]').forEach(b=>b.onclick=()=>act({type:'daily_delete',id:+b.dataset.dailyDel}));
  const dadd=document.querySelector('[data-daily-add]'); if(dadd) dadd.onclick=async()=>{const title=(val('dailyNew')||'').trim(); if(!title){tg.showAlert&&tg.showAlert('Впиши задачу');return;} await act({type:'daily_add',title,who:val('dailyWho')});};
  // пробел и прочие клавиши не должны перехватываться контейнером Telegram
  document.querySelectorAll('input,textarea').forEach(el=>{el.addEventListener('keydown',e=>e.stopPropagation());el.addEventListener('keypress',e=>e.stopPropagation());});
  document.querySelectorAll('[data-dl]').forEach(inp=>inp.onchange=async()=>{const res=await api('POST',{type:'item_patch',id:+inp.dataset.dl,planId:TBL_PLAN,patch:{deadline:inp.value}}); if(res&&res.error){tg.showAlert&&tg.showAlert(res.error);} if(res&&res.items){TBL_ITEMS=res.items;render();}});
  const tdel=document.querySelector('[data-tdel]'); if(tdel) tdel.onclick=()=>{const del=async()=>{const res=await api('POST',{type:'item_delete',id:TBL_OPEN,planId:TBL_PLAN}); if(res&&res.items)TBL_ITEMS=res.items; TBL_OPEN=null; render();}; if(tg.showConfirm){tg.showConfirm('Удалить пункт?',(ok)=>{if(ok)del();});}else del();};
}

load();
</script>
</body>
</html>
