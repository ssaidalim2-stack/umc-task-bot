<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>UMC Task</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета берём у Telegram, но КАЖДЫЙ имеет собственный запасной вариант под текущую тему.
     Telegram Desktop (особенно Windows) подставляет --tg-theme-* не полностью: если придёт
     тёмный фон, а переменная текста не придёт, текст упадёт на светлый дефолт — отсюда
     «чёрное на чёрном» и «белое на белом». Поэтому тема дублируется через data-theme,
     который выставляется из tg.colorScheme — он есть всегда. */
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8b8b8b);
    --card: var(--tg-theme-secondary-bg-color, #f3f4f6);
    --btn: var(--tg-theme-button-color, #2ea6ff);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --accent:#22c55e;
    --accent2:#8b5cf6;
    --shadow: 0 2px 10px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --line: rgba(127,127,127,.16);
  }
  :root[data-theme="dark"]{
    --bg: var(--tg-theme-bg-color, #17212b);
    --text: var(--tg-theme-text-color, #f1f1f1);
    --hint: var(--tg-theme-hint-color, #9aa4ad);
    --card: var(--tg-theme-secondary-bg-color, #232e3c);
    --btn: var(--tg-theme-button-color, #2ea6ff);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --shadow: 0 2px 14px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
    --line: rgba(255,255,255,.12);
  }
  :root[data-theme="light"]{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --card: var(--tg-theme-secondary-bg-color, #f3f4f6);
  }
  /* Ручной выбор темы. Здесь НЕЛЬЗЯ брать цвет через var(--tg-theme-*): Telegram
     задаёт эти переменные inline-стилем на :root, они всегда определены, и запасное
     значение в var() не сработает — переключатель визуально ничего не менял.
     Поэтому при ручном выборе переменные Telegram игнорируются целиком. */
  :root[data-mode="manual"][data-theme="dark"]{
    --bg:#17212b; --text:#f1f1f1; --hint:#9aa4ad; --card:#232e3c;
    --btn:#2ea6ff; --btn-text:#ffffff;
    --shadow: 0 2px 14px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
    --line: rgba(255,255,255,.12);
  }
  :root[data-mode="manual"][data-theme="light"]{
    --bg:#ffffff; --text:#111111; --hint:#8b8b8b; --card:#f3f4f6;
    --btn:#2ea6ff; --btn-text:#ffffff;
    --shadow: 0 2px 10px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --line: rgba(127,127,127,.16);
  }
  /* системная тема — когда Telegram не сказал ничего */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: var(--tg-theme-bg-color, #17212b);
      --text: var(--tg-theme-text-color, #f1f1f1);
      --hint: var(--tg-theme-hint-color, #9aa4ad);
      --card: var(--tg-theme-secondary-bg-color, #232e3c);
      --shadow: 0 2px 14px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
      --line: rgba(255,255,255,.12);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:74px;font-size:15px;-webkit-font-smoothing:antialiased}
  header{padding:16px 16px 8px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .thbtn{flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px;cursor:pointer;line-height:1;transition:transform .12s ease}
  .thbtn:active{transform:scale(.92)}
  header h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.2px}
  header .sub{color:var(--hint);font-size:13px;margin-top:3px;font-weight:500}
  .wrap{padding:8px 12px}
  .card{background:var(--card);border-radius:16px;padding:15px;margin:10px 0;box-shadow:var(--shadow);border:1px solid var(--line)}
  .card h3{margin:0 0 10px;font-size:16px;font-weight:700;letter-spacing:-.1px;display:flex;align-items:center;gap:2px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .row>input,.row>select,.row>textarea{min-width:0}
  .muted{color:var(--hint);font-size:13px}
  .bar{height:9px;border-radius:6px;background:rgba(127,127,127,.18);overflow:hidden;margin:7px 0}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#4ade80);border-radius:6px;transition:width .4s ease}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;background:rgba(127,127,127,.16);font-size:12px;margin:2px 4px 2px 0;font-weight:600}
  .btn{appearance:none;border:0;border-radius:11px;background:var(--btn);color:var(--btn-text);padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px color-mix(in srgb, var(--btn) 45%, transparent);transition:transform .1s ease,opacity .15s ease}
  .btn:active{transform:scale(.97);opacity:.9}
  .btn.sec{background:rgba(127,127,127,.14);color:var(--text);box-shadow:none}
  .btn.full{width:100%;margin-top:8px}
  .btn.sm{padding:7px 11px;font-size:13px}
  .btn.xs{padding:5px 9px;font-size:12px;border-radius:9px}
  .framewrap{margin:2px 0 6px}
  .frame{border:1px solid rgba(127,127,127,.28);border-radius:12px;padding:9px;margin-bottom:8px;background:var(--bg)}
  .fhead{display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .fhead b{font-size:13px}
  .fsp{flex:1}
  .frow{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
  .rsel{flex:0 0 auto;width:auto;min-width:64px;border-radius:8px;border:1px solid rgba(127,127,127,.3);background:var(--bg);color:var(--text);padding:7px 6px;font-size:13px;font-family:inherit}
  .rta{flex:1;min-height:44px;font-size:14px;padding:8px}
  .frowbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .xbtn{appearance:none;border:1px solid rgba(127,127,127,.3);background:rgba(127,127,127,.12);color:var(--text);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;line-height:1}
  .vid{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:11px 4px;margin:0 -4px;border-bottom:1px solid var(--line);gap:8px;border-radius:8px;transition:background .12s ease}
  .vid:last-child{border-bottom:0}
  .vid[data-topen]{cursor:pointer}
  .vid[data-topen]:active{background:rgba(127,127,127,.08)}
  .tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .tabbar button{flex:1 1 0;min-width:0;background:none;border:0;color:var(--hint);padding:9px 4px 10px;font-size:11px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;transition:color .15s ease}
  .msheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;backdrop-filter:blur(2px)}
  .msheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 14px calc(58px + env(safe-area-inset-bottom));box-shadow:0 -8px 36px rgba(0,0,0,.35)}
  .msheet-title{font-size:15px;font-weight:800;margin-bottom:12px}
  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
  .calwd{text-align:center;font-size:11px;opacity:.6;padding:2px 0}
  .calcell{min-width:0;width:auto;height:40px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:transform .1s ease}
  .calcell:active{transform:scale(.94)}
  .calcell.empty{cursor:default;background:transparent!important}
  .calcell.today .calnum{text-decoration:underline}
  .calcell.sel{box-shadow:inset 0 0 0 2px #fff}
  .calcell.has-shoot{box-shadow:inset 0 0 0 2px #f5a524}
  .calcell.has-shoot.sel{box-shadow:inset 0 0 0 2px #f5a524, inset 0 0 0 4px #fff}
  .calnum{font-weight:600}
  .caldot{font-size:10px;margin-top:1px}
  .umc-logo{display:block;width:auto;color:var(--text)}
  .umc-spin{animation:umcSpin 1.6s ease-in-out infinite}
  @keyframes umcSpin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.86);opacity:.55}}
  .umc-loader{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0}
  #splash{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .35s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .umc-logo{animation:umcIn .55s ease both}
  @keyframes umcIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
  .wkday{padding:12px 14px;margin-top:8px}
  .wktoday{box-shadow:inset 0 0 0 2px var(--btn)}
  .wkitem{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
  .wkitem:first-of-type{border-top:0}
  .mcell{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 4px;border-radius:14px;background:var(--card);font-size:11px;font-weight:600;cursor:pointer;text-align:center;border:1px solid var(--line);transition:transform .1s ease}
  .mcell:active{transform:scale(.95)}
  .mcell span{font-size:23px}
  .mcell.active{outline:2px solid var(--btn);color:var(--btn)}
  .tabbar button.active{color:var(--btn)}
  .tabbar .ic{display:block;font-size:21px;margin-bottom:2px}
  .pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
  .pill{white-space:nowrap;padding:7px 13px;border-radius:20px;background:var(--card);font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);transition:transform .1s ease,box-shadow .15s ease}
  .pill:active{transform:scale(.96)}
  .pill.active{background:var(--btn);color:var(--btn-text);border-color:transparent;box-shadow:0 2px 8px color-mix(in srgb, var(--btn) 40%, transparent)}
  a{color:var(--btn)}
  .empty{text-align:center;color:var(--hint);padding:36px 16px;font-size:14px}
  .stageline{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
  .seg{flex:1;min-width:54px;text-align:center;font-size:11px;font-weight:600;padding:6px 2px;border-radius:8px;background:rgba(127,127,127,.13)}
  .seg.on{background:linear-gradient(135deg,var(--accent),#16a34a);color:#fff}
  textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:10px;font-size:15px;font-family:inherit;resize:vertical;transition:border-color .15s ease}
  input{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:9px 10px;font-size:15px;font-family:inherit;transition:border-color .15s ease}
  input[type=checkbox]{width:16px;height:16px;flex:none;padding:0}
  textarea:focus,input:focus{outline:none;border-color:var(--btn)}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:rgba(127,127,127,.16)}
  .ctab{width:100%;border-collapse:collapse;font-size:13px}
  .ctab th,.ctab td{padding:8px 5px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  .ctab th{color:var(--hint);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .ctab td:first-child,.ctab th:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600}
  .board{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
  .bcol{flex:0 0 80%;max-width:300px;background:var(--card);border-radius:14px;padding:11px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .bhead{font-weight:800;font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .bcount{font-size:12px;font-weight:700;color:var(--hint);background:rgba(127,127,127,.18);border-radius:10px;padding:1px 8px}
  .bcard{background:var(--bg);border-radius:11px;padding:9px 11px;margin-bottom:6px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .rowdl{width:78px;padding:5px 7px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:12px;flex:0 0 auto}
  /* на iPad/десктопе (широкий вьюпорт) центрируем контент разумной ширины вместо растягивания на весь экран.
     Блок стоит В КОНЦЕ таблицы стилей намеренно — иначе более поздние базовые правила (например .tabbar{left:0;right:0}) перебивают центрирование по порядку каскада. */
  @media (min-width:720px){
    header,.wrap{max-width:1100px;margin-left:auto;margin-right:auto;padding-left:18px;padding-right:18px}
    .tabbar{left:0;right:0;width:100%;margin:0;border-radius:0;justify-content:center;gap:28px}
    .tabbar button{max-width:150px}
    .msheet{max-width:720px;margin:0 auto}
    /* на широком экране карточки идут в две колонки — иначе это та же телефонная лента,
       только с огромными полями по бокам */
    .wrap{column-gap:16px}
  }
  @media (min-width:1500px){
    header,.wrap{max-width:1360px}
  }
  /* карточки с большим количеством полей (пункт плана, сторис, ТЗ, umc, продажи):
     на широком экране основной текст уходит в левую колонку, параметры — в правую,
     чтобы всё помещалось на один экран. На телефоне порядок полей прежний. */
  @media (min-width:900px){
    .split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);grid-template-rows:auto 1fr auto;
      grid-template-areas:"main meta" "main extra" "wide wide";gap:0 24px;align-items:start}
    .sp-main{grid-area:main} .sp-meta{grid-area:meta} .sp-extra{grid-area:extra} .sp-wide{grid-area:wide}
    /* !important — у полей есть inline min-height под телефон */
    .sp-main textarea{min-height:300px!important}
    .sp-main .frame textarea{min-height:60px!important}
    .sp-meta .pills,.sp-extra .pills{flex-wrap:wrap;gap:6px;padding:2px 0 6px}
    .sp-meta .pill,.sp-extra .pill{padding:5px 11px;font-size:12px}
    .sp-extra textarea{min-height:44px!important}
  }
  @media (min-width:720px){
    .fcols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}
    .fcols>.wide{grid-column:1/-1}
  }
  /* тип пункта контент-плана: свой цвет у видео, граф-поста и фото — и в таблице, и в карточке */
  .tb{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:800;white-space:nowrap}
  .tb-video{background:rgba(37,99,235,.16);color:#3b82f6}
  .tb-graphic{background:rgba(219,39,119,.16);color:#ec4899}
  .tb-photo{background:rgba(217,119,6,.18);color:#f59e0b}
  .vid.trow{border-left:4px solid transparent;padding-left:10px;margin-left:0}
  .vid.trow-video{border-left-color:#3b82f6}
  .vid.trow-graphic{border-left-color:#ec4899}
  .vid.trow-photo{border-left-color:#f59e0b}
  .trow-main{min-width:0;flex:1;cursor:pointer;line-height:1.5}
  .trow-ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  /* на телефоне: номер, тип и тема — на всю ширину, управление строкой ниже */
  @media (max-width:719px){ .trow-main{flex:1 1 calc(100% - 34px)} .trow-ctl{width:100%;padding-left:28px} }
  /* дашборд: карточки в две колонки, порядок сверху вниз как на телефоне */
  @media (min-width:900px){
    .dash{column-count:2;column-gap:16px}
    .dash>.card{break-inside:avoid;display:inline-block;width:100%;margin:0 0 12px}
  }
  /* финансы: на широком экране карточки раздела встают в две колонки */
  @media (min-width:720px){
    .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
  }
</style>
</head>

const THEME_ICON={auto:'🌓',light:'☀️',dark:'🌙'};
function applyTheme(){
  try{
    let sc;
    if(THEME_PREF==='light'||THEME_PREF==='dark') sc=THEME_PREF;
    else sc=tg.colorScheme==='dark'?'dark':tg.colorScheme==='light'?'light':'';
    const root=document.documentElement;
    if(sc) root.setAttribute('data-theme',sc); else root.removeAttribute('data-theme');
    // ручной выбор — переменные Telegram в игру не берём
    if(THEME_PREF==='light'||THEME_PREF==='dark') root.setAttribute('data-mode','manual');

}

// сжать фото на клиенте перед отправкой (иначе JSON-тело может быть слишком большим)
function readImageCompressed(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const maxDim=1280;
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ const s=maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.75));
      };
      img.onerror=()=>reject(new Error('img'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('file'));
    reader.readAsDataURL(file);
  });
}

let AS_TIMER=null, AS_STATE='', AS_ITEM=null, UNDO=[], AS_LAST=0;
const AS_FIELDS=['theme','script','reference','props','location','shoot_date','deadline','lang','format','stage','type','target_only','no_shoot'];
function itemSnapshot(it){ const o={}; AS_FIELDS.forEach(k=>o[k]=it[k]||''); o.frames=JSON.parse(JSON.stringify(it.frames||[])); return o; }
function applySnapshot(it,snap){ AS_FIELDS.forEach(k=>it[k]=snap[k]); it.frames=JSON.parse(JSON.stringify(snap.frames||[])); }
function itemFingerprint(it){ return JSON.stringify(itemSnapshot(it)); }

// сохраняем через 1.5 с после последнего изменения (а не на каждую букву)
function scheduleAutosave(){

  const it=(TBL_ITEMS||[]).find(x=>x.id==TBL_OPEN); if(!it||it.locked&&DATA.user.role!=='admin') return;
  captureFields(it);

  clearTimeout(AS_TIMER);

}
async function runAutosave(silent){
  const it=(TBL_ITEMS||[]).find(x=>x.id==TBL_OPEN); if(!it) return;
  captureFields(it);
  const fp=itemFingerprint(it);
  if(fp===AS_STATE) return;
  const prev=AS_STATE;
  AS_STATE=fp;
  if(prev){ UNDO.push(prev); if(UNDO.length>30) UNDO.shift(); }
  setSaveHint('сохраняю…');
  try{
    const res=await api('POST',{type:'item_update',id:it.id,planId:TBL_PLAN,fields:autosaveFields(it)});
    if(res&&res.error){ setSaveHint('⚠ '+res.error,'#e5484d'); AS_STATE=prev; UNDO.pop(); return; }
    if(res&&res.items){ const srv=res.items.find(x=>x.id===it.id); if(srv) it.idx=srv.idx; }
    AS_LAST=Date.now();
    setSaveHint('✓ сохранено','#2ea043');
    if(!silent) { const btn=document.querySelector('[data-undo]'); if(btn) btn.disabled=!UNDO.length; }
  }catch(e){ setSaveHint('⚠ нет связи — не сохранено','#e5484d'); AS_STATE=prev; UNDO.pop(); }
}
async function undoLast(){
  if(!UNDO.length) return;
  const snap=JSON.parse(UNDO.pop());
  const it=(TBL_ITEMS||[]).find(x=>x.id==TBL_OPEN); if(!it) return;
  applySnapshot(it,snap);

}
let ASSIGN_I=0;
const DAILY_ROLE_OPTS=[["manager","Менеджеры"],["pm","Проджект-менеджеры"],["videographer","Видеографы"],["editor","Монтажёры"],["designer","Дизайнеры"],["sales","Отдел продаж"]];
const TYPE_OPTS=[["video","🎬 Видео"],["graphic","🖼 Граф-пост"],["photo","📷 Фото"]];
const TYPE_ICON={video:"🎬",graphic:"🖼",photo:"📷"};
const TYPE_NAME={video:"Видео",graphic:"Граф-пост",photo:"Фото"};
// номер внутри своего типа: «3: Граф-пост 1» — позиция в плане общая, а счёт видео и постов свой
function typeNumbers(items){

// it — сам пункт (необязательно): без съёмки нет этапа «Снято», у «только таргет» финал — «В таргете»
function STATUS_OPTS(type,it){
  if(type!=='video') return [["todo","🕒 В работе"],["done","✅ Готово"]];
  let o=[["idea","🕒 В плане"],["script","📝 Сценарий готов"],["shoot","🎥 Снято"],["edit","✂️ Смонтировано"],["published","✅ Опубликовано"]];
  if(it&&it.no_shoot&&it.stage!=='shoot') o=o.filter(x=>x[0]!=='shoot');
  if(it&&it.target_only) o=o.map(x=>x[0]==='published'?["published","🎯 В таргете"]:x);
  return o;
}
function statusLabel(type,stage,it){ const o=STATUS_OPTS(type,it).find(x=>x[0]==stage); return o?o[1]:stage; }
const LANG_OPTS=[["ru","🇷🇺 Рус"],["uz","🇺🇿 Узб"],["en","🇬🇧 Англ"]];
const FORMAT_OPTS=[["sell","💰 Продажный"],["fun","🎉 Развлекательный"],["info","📘 Информативный"],["atmo","🌙 Атмосферный"]];
function formatLabel(f){ const o=FORMAT_OPTS.find(x=>x[0]===f); return o?o[1]:''; }
const LANG_SHORT={ru:"РУС",uz:"УЗБ",en:"ENG"};
function frameLabel(fr,n){ return fr.kind==='hook'?'🎬 Хук (зацепка)':fr.kind==='cta'?'📣 Призыв (CTA)':('🎞 Кадр '+n); }
// миграция старого формата (rows[]) в единый непрерывный текст кадра
function frameText(fr){
  if(fr.text==null){ fr.text=(fr.rows||[]).map(r=>`${r.r?r.r+': ':''}${r.t||''}`).join(' ').trim(); delete fr.rows; }
  return fr.text||'';
}
// пользовательские роли, уже встречавшиеся в тексте кадров (кроме Д/Т) — предлагаются как кнопки быстрой вставки
function scenarioRoles(it){
  const s=new Set();
  for(const fr of (it.frames||[])){
    const re=/(?:^|[\s.,!?])([A-ZА-ЯЁ][\wа-яёA-Za-z]*)\s*:/g; let m;
    while((m=re.exec(frameText(fr)))) if(!['Д','Т'].includes(m[1])) s.add(m[1]);
  }
  return [...s];
}
function renumberFrames(it){ let n=0; for(const fr of (it.frames||[])) if(fr.kind==='frame') fr._n=(++n); }
// полный текст пункта для копирования: сценарий по кадрам с подписями + референс/реквизиты
// (includeExtras=false — для группового копирования, где реф/реквизиты собираются отдельным списком)
function buildFullScriptText(it,includeExtras){
  if(includeExtras===undefined) includeExtras=true;
  const projName=(DATA.projects||[]).find(p=>p.id==TBL_PROJ)?.name||'';
  const head=[];
  if(projName) head.push('Проект: '+projName);
  if(it.theme&&it.theme.trim()) head.push('Тема: '+it.theme.trim());
  if(it.target_only) head.push('Размещение: только таргет (в ленту не публикуется)');
  else if(it.type==='video'&&it.no_shoot) head.push('Без съёмки — из готовых материалов');
  if(!it.no_shoot&&it.shoot_date&&it.shoot_date.trim()) head.push('Дата съёмки: '+it.shoot_date.trim()+(it.shoot_time?' '+it.shoot_time:''));
  if(it.deadline&&it.deadline.trim()) head.push((it.target_only?'Дедлайн запуска в таргет: ':'Дедлайн на публикацию: ')+it.deadline.trim());
  const plain=s=>String(s||'').replace(/^\S+\s/,''); // отрезать эмодзи-префикс из подписи
  const vk=it.type==='video'?' видео':'';
  if(it.format) head.push('Формат'+vk+': '+plain(formatLabel(it.format)));
  if(it.lang){ const l=LANG_OPTS.find(x=>x[0]===it.lang); if(l) head.push('Язык'+vk+': '+plain(l[1])); }
  if(it.type!=='graphic'&&it.location&&it.location.trim()) head.push('Локация: '+it.location.trim());

  const frames=[];
  if(it.type==='video' && it.frames && it.frames.length){
    renumberFrames(it);
    it.frames.forEach(fr=>{
      const t=frameText(fr); if(!t.trim()) return;
      const label=fr.kind==='hook'?'ХУК':fr.kind==='cta'?'ПРИЗЫВ (CTA)':('КАДР '+(fr._n||''));
      frames.push(label+':\n'+t);
    });
  } else if(it.script&&it.script.trim()){
    frames.push(it.script.trim());
  }

  const parts=[];
  if(head.length) parts.push(head.join('\n'));
  if(frames.length) parts.push((it.type==='video'?'Сценарий по кадрам:':'Текст:')+'\n\n'+frames.join('\n\n'));
  if(includeExtras){
    if(it.reference&&it.reference.trim()) parts.push('Референс: '+it.reference.trim());
    if(it.props&&it.props.trim()) parts.push((it.type==='graphic'?'Стиль, цвета, шрифты: ':'Реквизиты: ')+it.props.trim());
  }
  return parts.join('\n\n');
}

// цикл «с 15 по 15»
function cycleDates(back){ // back=0 текущий, 1 прошлый
  const now=new Date(Date.now()+5*3600*1000);
  let y=now.getUTCFullYear(), m=now.getUTCMonth();
  if(now.getUTCDate()<15) m--;
  m-=back;
  const s=new Date(Date.UTC(y,m,15)), e=new Date(Date.UTC(y,m+1,15));
  const today=now.toISOString().slice(0,10);
  const until=e.toISOString().slice(0,10)<=today?e.toISOString().slice(0,10):today;
  return [s.toISOString().slice(0,10), until];
}
async function anLoad(){
  if(!AN_SINCE){ const[s,u]=cycleDates(0); AN_SINCE=s; AN_UNTIL=u; }
  AN_LOADING=true; AN_ERR=null; AN_DATA=null; render();
  const req=AN_SEC==='cmp'?{type:'analytics_compare',since:AN_SINCE,until:AN_UNTIL}
    :{type:(AN_SEC==='ads'?'analytics_ads':'analytics_media'),projectKey:AN_PROJ,since:AN_SINCE,until:AN_UNTIL};
  const r=await api('POST',req);
  AN_LOADING=false;
  if(!r||r.error){AN_ERR=(r&&r.error)||'ошибка';}else{AN_DATA=r;}
  render();
}

let TBL_VIEW='weeks';

const MONTH_SHORT=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
// «18.10», «18.10.2026 18:00», «18.10 суббота» → дата; год не указан — ближайший к сегодняшнему
function itemDay(s){
  const m=String(s||'').trim().match(/^(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{2,4}))?/);
  if(!m) return null;
  const now=tashkentNow(); let y=m[3]?+m[3]:now.getUTCFullYear(); if(y<100) y+=2000;
  let d=new Date(Date.UTC(y,+m[2]-1,+m[1]));
  if(isNaN(d)||d.getUTCDate()!==+m[1]) return null;
  if(!m[3]){ const diff=(d-now)/86400000; if(diff>182) d=new Date(Date.UTC(y-1,+m[2]-1,+m[1])); else if(diff<-182) d=new Date(Date.UTC(y+1,+m[2]-1,+m[1])); }
  return d;
}
function weekRange(mon){ const sun=new Date(mon.getTime()+6*86400000);
  return mon.getUTCMonth()===sun.getUTCMonth()?`${mon.getUTCDate()}–${sun.getUTCDate()} ${MONTH_SHORT[sun.getUTCMonth()]}`:`${mon.getUTCDate()} ${MONTH_SHORT[mon.getUTCMonth()]} – ${sun.getUTCDate()} ${MONTH_SHORT[sun.getUTCMonth()]}`; }
function renderWeeks(vis,nums,posOf){
  const groups=new Map(), undated=[];
  for(const it of vis){ const d=itemDay(it.deadline); if(!d){ undated.push(it); continue; } const k=wkKey(mondayOf(d)); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(it); }
  const thisWeek=wkKey(mondayOf(tashkentNow()));
  const done=it=>it.stage==='published'||it.stage==='done';
  const head=(title,sub,list,cur)=>{
    const v=list.filter(x=>x.type==='video').length, g=list.filter(x=>x.type==='graphic').length, ph=list.filter(x=>x.type==='photo').length;
    const cnt=[v?`🎬 ${v}`:'',g?`🖼 ${g}`:'',ph?`📷 ${ph}`:''].filter(Boolean).join(' · ');
    return `<div class="row" style="flex-wrap:wrap;gap:4px 10px;margin:14px 0 4px;padding:8px 10px;border-radius:10px;background:${cur?'color-mix(in srgb, var(--btn) 18%, transparent)':'rgba(127,127,127,.12)'}">
      <div><b>${title}</b>${sub?` <span class="muted">· ${sub}</span>`:''}${cur?' <span class="badge" style="background:var(--btn);color:var(--btn-text);white-space:nowrap">эта неделя</span>':''}</div>
      <div class="muted" style="font-size:12px;white-space:nowrap">${cnt} · готово ${list.filter(done).length}/${list.length}</div></div>`;
  };
  let h='', n=0;
  for(const k of [...groups.keys()].sort()){
    const list=groups.get(k).sort((a,b)=>itemDay(a.deadline)-itemDay(b.deadline)||a.idx-b.idx);
    n++;
    h+=head(`Неделя ${n}`,weekRange(new Date(k+'T00:00:00Z')),list,k===thisWeek)+list.map(it=>rowHtml(it,posOf.get(it.id),nums[it.id])).join('');
  }
  if(undated.length) h+=head('📌 Без даты выхода','впиши дедлайн — пункт встанет в свою неделю',undated,false)+undated.map(it=>rowHtml(it,posOf.get(it.id),nums[it.id])).join('');
  return h;
}

// в читаемые карточки по блокам — сырая таблица в чате телефона нечитаема
function parseAiTz(raw){
  const lines=String(raw||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const headLine=lines.find(l=>/^Стиль/i.test(l))||'';
  const rowLines=lines.filter(l=>l.startsWith('|')&&l.endsWith('|'));
  if(rowLines.length<2) return null;
  const splitRow=l=>l.slice(1,-1).split('|').map(c=>c.trim());
  const cols=splitRow(rowLines[0]);
  const data=rowLines.slice(1).filter(l=>!/^\|?[\s:|-]+\|?$/.test(l)).map(splitRow);
  if(!data.length) return null;
  return {head:headLine,cols,data};
}
function cellHtml(v){ return esc(v||'').replace(/&lt;br&gt;/gi,'<br>').replace(/&lt;br\/&gt;/gi,'<br>'); }
// то же, что рендерится карточками на экране, но плоским читаемым текстом — для копирования
// (сырой markdown с | и --- нечитаем при вставке в Telegram/куда угодно ещё)
function formatAiTzPlain(raw){
  const parsed=parseAiTz(raw);
  if(!parsed||!parsed.data.length) return raw;
  const blocks=parsed.data.map(row=>parsed.cols.map((c,ci)=>row[ci]?`${c}: ${row[ci].replace(/<br\s*\/?>/gi,' / ')}`:'').filter(Boolean).join('\n'));
  return (parsed.head?parsed.head+'\n\n':'')+blocks.join('\n\n');
}
function renderAiTzBlock(it){
  if(!it.ai_tz) return '';
  const parsed=parseAiTz(it.ai_tz);
  const body=(parsed&&parsed.data.length)
    ? parsed.data.map((row,ri)=>`<div class="card" style="margin-top:6px;padding:10px 12px">
        ${parsed.cols.map((c,ci)=>row[ci]?`<div style="margin-bottom:5px"><span class="muted" style="font-size:11px">${esc(c)}</span><br>${cellHtml(row[ci])}</div>`:'').join('')}
      </div>`).join('')
    : `<textarea readonly style="min-height:220px;font-size:12.5px">${esc(it.ai_tz)}</textarea>`;
  return `<div class="row" style="margin-top:10px"><div class="muted">Раскадровка монтажа (AI)${parsed&&parsed.head?' — '+esc(parsed.head):''}</div><button class="xbtn" data-aicopy>📋 Копировать</button></div>${body}`;
}

function renderVideo(){
  if(!PROJ) PROJ=DATA.projects[0]?.id;
  const pills=DATA.projects.map(p=>`<div class="pill ${p.id==PROJ?'active':''}" data-proj="${p.id}">${esc(p.name)}</div>`).join('');
  const p=DATA.projects.find(x=>x.id==PROJ); if(!p) return '<div class="empty">Нет проектов</div>';
  const stages=DATA.stages, lbl=DATA.stageLabels;
  const items=p.videos.map(vd=>{
    const segs=stages.map(s=>{const i=stages.indexOf(s),c=stages.indexOf(vd.stage);return `<div class="seg ${i<=c?'on':''}">${lbl[s].replace(/^[^ ]+ /,'')}</div>`;}).join('');
    const nx=stages[stages.indexOf(vd.stage)+1]; let a='';
    if(vd.stage==='idea') a+=`<button class="btn sm ${vd.format==='fun'?'':'sec'}" data-fmt="${vd.id}:fun">🎭</button><button class="btn sm ${vd.format==='sell'?'':'sec'}" data-fmt="${vd.id}:sell">💰</button>`;
    if(nx) a+=`<button class="btn sm" data-adv="${vd.id}">→ ${lbl[nx].replace(/^[^ ]+ /,'')}</button>`; else a+=`<span class="chip">✅ готово</span>`;
    if(vd.pending) a='<span class="chip">⏳ на подтверждении</span>';
    return `<div class="card"><div class="row"><b>Видео #${vd.idx}</b><span class="chip">${lbl[vd.stage]}</span></div><div class="stageline">${segs}</div><div class="row" style="margin-top:10px;gap:6px;justify-content:flex-end">${a}</div></div>`;
  }).join('');
  return `<div class="pills">${pills}</div><div class="card"><div class="row"><h3>${esc(p.name)}</h3>${p.sheet_url?`<a href="${p.sheet_url}" target="_blank">📊 Таблица</a>`:''}</div><div class="muted">🖼 Графика ${p.graphicDone}/${p.graphicTotal}</div><button class="btn sm full" data-gfx="${p.id}">🖼 +1 графика готова</button></div>${items}`;
}

function prog(label,done,total){ return `<div class="muted">${label}: <b>${done}/${total}</b></div>${bar(done,total)}`; }

// null, если дедлайн ещё не близко; иначе метка срочности для баннера на Главной
function urgencyInfo(deadlineIso){
  if(!deadlineIso) return null;
  const diff=new Date(deadlineIso).getTime()-Date.now();
  if(diff<=0) return {level:'overdue',text:'⛔ просрочено'};
  if(diff<=24*3600*1000) return {level:'soon',text:'через '+Math.max(1,Math.round(diff/3600000))+' ч'};
  return null;
}

let CR_PROJ=null, CR_PLAN=null, CR_TEXT=null, CR_GROUPS=0, CR_LOADING=false, CR_NOTE='', CR_REPORT=null, CR_IMG=null;
// ---- картинка контент-плана для клиента: рисуется прямо в приложении (canvas → PNG),
// без внешних сервисов, чтобы выглядела одинаково на любом устройстве ----
const CR_ST={
  idea:['В плане','#64748b'], script:['Сценарий готов','#d97706'], shoot:['Снято','#7c3aed'],
  edit:['Смонтировано','#2563eb'], published:['Опубликовано','#16a34a'], todo:['В работе','#d97706'], done:['Готово','#16a34a'],
};
const CR_LANG={ru:'РУС',uz:'УЗБ',en:'ENG'};
const CR_FONT='-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
function crRound(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function crWrap(ctx,text,maxW,maxLines){
  const words=String(text||'').split(/\s+/).filter(Boolean); const lines=[]; let cur='';
  for(const w of words){
    const t=cur?cur+' '+w:w;
    if(ctx.measureText(t).width<=maxW){ cur=t; continue; }
    if(cur) lines.push(cur); cur=w;
    while(ctx.measureText(cur).width>maxW && cur.length>1){ let k=cur.length-1; while(k>1&&ctx.measureText(cur.slice(0,k)).width>maxW) k--; lines.push(cur.slice(0,k)); cur=cur.slice(k); }
  }
  if(cur) lines.push(cur);
  if(lines.length>maxLines){ const keep=lines.slice(0,maxLines); let last=keep[maxLines-1]; while(last.length>1&&ctx.measureText(last+'…').width>maxW) last=last.slice(0,-1); keep[maxLines-1]=last+'…'; return keep; }
  return lines;
}
function crDate(iso){ return iso?iso.split('-').reverse().slice(0,2).join('.'):''; }
function drawPlanImage(r){
  const items=r.items||[];
  const videos=items.filter(x=>x.type==='video'), gfx=items.filter(x=>x.type!=='video');
  const c=s=>videos.filter(v=>v.stage===s).length;
  const W=1600, pad=64, cols=4, gap=22, cardH=214;
  const cardW=Math.floor((W-2*pad-(cols-1)*gap)/cols);
  const rows=Math.max(1,Math.ceil(items.length/cols));
  const top=560, H=top+rows*(cardH+gap)+110;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d'); ctx.textBaseline='alphabetic';
  ctx.fillStyle='#f1f5f9'; ctx.fillRect(0,0,W,H);
  // шапка
  const grd=ctx.createLinearGradient(0,0,W,0); grd.addColorStop(0,'#1d4ed8'); grd.addColorStop(1,'#2563eb');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,236);
  ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font=`700 26px ${CR_FONT}`; ctx.fillText('КОНТЕНТ-ПЛАН',pad,74);
  ctx.fillStyle='#ffffff'; ctx.font=`800 64px ${CR_FONT}`; ctx.fillText(crWrap(ctx,r.project||'',W-2*pad,1)[0]||'',pad,148);
  const today=new Date(Date.now()+5*3600*1000).toISOString().slice(0,10).split('-').reverse().join('.');
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font=`500 28px ${CR_FONT}`;
  ctx.fillText(crWrap(ctx,(r.period?r.period+'  ·  ':'')+'статус на '+today,W-2*pad,1)[0]||'',pad,200);
  // итоги
  const tiles=[[`${c('published')}/${videos.length}`,'видео опубликовано','#16a34a'],[String(c('edit')),'смонтировано','#2563eb'],[String(c('shoot')),'снято, в монтаже','#7c3aed'],[String(c('script')),'сценарии готовы','#d97706'],
    gfx.length?[`${gfx.filter(g=>g.stage==='done').length}/${gfx.length}`,'графика готова','#db2777']:[String(c('idea')),'в плане','#64748b']];
  const tw=Math.floor((W-2*pad-4*gap)/5);
  tiles.forEach(([v,l,col],i)=>{
    const x=pad+i*(tw+gap), y=272;
    ctx.fillStyle='#ffffff'; crRound(ctx,x,y,tw,132,18); ctx.fill(); ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=col; ctx.font=`800 52px ${CR_FONT}`; ctx.fillText(v,x+24,y+70);
    ctx.fillStyle='#475569'; ctx.font=`600 22px ${CR_FONT}`; ctx.fillText(l,x+24,y+108);
  });
  // прогресс
  const pct=videos.length?Math.round(c('published')/videos.length*100):0;
  ctx.fillStyle='#e2e8f0'; crRound(ctx,pad,438,W-2*pad,18,9); ctx.fill();
  if(pct){ ctx.fillStyle='#16a34a'; crRound(ctx,pad,438,Math.max(18,(W-2*pad)*pct/100),18,9); ctx.fill(); }
  ctx.fillStyle='#0f172a'; ctx.font=`700 30px ${CR_FONT}`; ctx.fillText('Статус по контенту',pad,520);
  ctx.fillStyle='#64748b'; ctx.font=`600 24px ${CR_FONT}`; const pt=`опубликовано ${pct}% видео`; ctx.fillText(pt,W-pad-ctx.measureText(pt).width,520);
  // карточки
  items.forEach((it,i)=>{
    const x=pad+(i%cols)*(cardW+gap), y=top+Math.floor(i/cols)*(cardH+gap);
    const [stLabel,stColor]=it.target_only&&it.stage==='published'?['Запущено в таргет','#ea580c']:(CR_ST[it.stage]||[it.stage,'#64748b']);
    const fin=it.stage==='published'||it.stage==='done';
    ctx.fillStyle=fin?'#f0fdf4':'#ffffff'; crRound(ctx,x,y,cardW,cardH,18); ctx.fill();
    ctx.strokeStyle=fin?'#bbf7d0':'#e2e8f0'; ctx.lineWidth=2; ctx.stroke();
    ctx.save(); crRound(ctx,x,y,cardW,cardH,18); ctx.clip(); ctx.fillStyle=stColor; ctx.fillRect(x,y,10,cardH); ctx.restore();
    const kind=it.type==='video'?'ВИДЕО':it.type==='photo'?'ФОТО':'ГРАФ-ПОСТ';
    ctx.fillStyle='#94a3b8'; ctx.font=`800 20px ${CR_FONT}`; ctx.fillText(`${i+1}: ${kind} ${it.num||it.idx}`,x+28,y+40);
    // дата выхода — в правом верхнем углу: внизу её вытесняли длинный статус и язык
    if(!fin&&it.publishDay){ ctx.fillStyle='#475569'; ctx.font=`700 20px ${CR_FONT}`; const dt='выход '+crDate(it.publishDay); ctx.fillText(dt,x+cardW-20-ctx.measureText(dt).width,y+40); }
    ctx.fillStyle='#0f172a'; ctx.font=`600 25px ${CR_FONT}`;
    crWrap(ctx,it.theme||'Тема уточняется',cardW-52,3).forEach((ln,k)=>ctx.fillText(ln,x+28,y+78+k*32));
    // статус + язык + дата выхода
    ctx.font=`700 20px ${CR_FONT}`; const sw=ctx.measureText(stLabel).width+28;
    ctx.fillStyle=stColor; crRound(ctx,x+28,y+cardH-52,sw,34,17); ctx.fill();
    ctx.fillStyle='#ffffff'; ctx.fillText(stLabel,x+42,y+cardH-28);
    let cx=x+28+sw+10;
    if(it.target_only){ ctx.font=`700 20px ${CR_FONT}`; const tw2=ctx.measureText('ТАРГЕТ').width+24; ctx.fillStyle='#ffedd5'; crRound(ctx,cx,y+cardH-52,tw2,34,17); ctx.fill(); ctx.fillStyle='#c2410c'; ctx.fillText('ТАРГЕТ',cx+12,y+cardH-28); cx+=tw2+10; }
    if(CR_LANG[it.lang]){ const lw=ctx.measureText(CR_LANG[it.lang]).width+24; ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=2; crRound(ctx,cx,y+cardH-52,lw,34,17); ctx.stroke(); ctx.fillStyle='#334155'; ctx.fillText(CR_LANG[it.lang],cx+12,y+cardH-28); cx+=lw+10; }
  });
  if(!items.length){ ctx.fillStyle='#64748b'; ctx.font=`600 28px ${CR_FONT}`; ctx.fillText('В этом периоде пока нет пунктов',pad,top+60); }
  ctx.fillStyle='#94a3b8'; ctx.font=`700 22px ${CR_FONT}`; const ft='UMC marketing team'; ctx.fillText(ft,W-pad-ctx.measureText(ft).width,H-44);
  return cv.toDataURL('image/png');
}

function anCmp(){
  const rows=(AN_DATA.rows||[]);
  if(!rows.length) return '<div class="empty">Нет привязанных проектов</div>';
  const met=[['spend','💰 Затраты'],['results','🎯 Результаты'],['reach','👁 Охват'],['views','▶️ Просмотры'],['followerGain','👥 +Подписчики']];
  let h='<div class="card"><h3>⚖️ Сравнение проектов</h3>';
  for(const[k,l]of met){
    const max=Math.max(...rows.map(r=>r[k]||0),1);
    const sum=rows.reduce((a,r)=>a+(r[k]||0),0);
    h+=`<div class="muted" style="margin-top:10px;font-weight:600">${l}${sum?` · всего ${k==='spend'?fmtM(sum,rows[0].currency):fmtN(sum)}`:''}</div>`;
    h+=rows.map(r=>{
      const v=r[k]||0, pct=sum?Math.round(v/sum*100):0;
      return `<div class="row" style="gap:8px;margin-top:3px"><span style="flex:0 0 90px;font-size:13px">${esc(r.name.split(' ')[0])}</span>
        <div style="flex:1;height:14px;background:rgba(127,127,127,.15);border-radius:7px;overflow:hidden"><div style="height:100%;width:${Math.round(v/max*100)}%;background:var(--accent)"></div></div>
        <span style="flex:0 0 auto;font-size:12px" class="muted">${k==='spend'?fmtM(v,r.currency):fmtN(v)} · ${pct}%</span></div>`;
    }).join('');
  }
  const errs=rows.filter(r=>r.error);
  if(errs.length) h+='<div class="muted" style="font-size:12px;margin-top:8px">'+errs.map(r=>`⚠️ ${esc(r.name)}: ${esc(r.error).slice(0,60)}`).join('<br>')+'</div>';
  h+='</div>';
  const labels=rows.map(r=>r.name.split(' ')[0]);
  const chart={type:'bar',data:{labels,datasets:[
    {label:'Результаты',data:rows.map(r=>r.results||0),backgroundColor:'#22c55e'},
    {label:'Охват (тыс.)',data:rows.map(r=>Math.round((r.reach||0)/1000)),backgroundColor:'#60a5fa'},
    {label:'+Подписчики',data:rows.map(r=>r.followerGain||0),backgroundColor:'#f59e0b'}]}};
  h+=`<div class="card"><img src="https://quickchart.io/chart?w=560&h=300&c=${encodeURIComponent(JSON.stringify(chart))}" style="width:100%;border-radius:10px"></div>`;
  return h;
}
let SUB_OPEN=null, SUB_EDIT=null;
function daysLeft(iso){ return Math.round((new Date(iso+'T00:00:00Z')-new Date(wkKey(tashkentNow())+'T00:00:00Z'))/86400000); }
function captureSub(){
  if(!SUB_EDIT) return;
  SUB_EDIT.app=val('sb_app'); SUB_EDIT.period_days=val('sb_days');
  SUB_EDIT.purchased_on=val('sb_bought'); SUB_EDIT.expires_on=val('sb_exp'); SUB_EDIT.price=val('sb_price');
}
function renderSubs(){
  const admin=DATA.user.role==='admin';
  if(SUB_OPEN!=null&&admin) return renderSubCard();
  const list=DATA.subscriptions||[];
  const rows=list.map(s=>{
    const d=daysLeft(s.expires_on);
    const mark=d<0?'<span class="badge" style="background:#e5484d;color:#fff">просрочена</span>'
      :d<=3?`<span class="badge" style="background:#f5a524;color:#fff">${d} дн.</span>`

    return `<div class="vid" ${admin?`data-subopen="${s.id}" style="cursor:pointer"`:''}>
      <div style="min-width:0;flex:1"><div><b>${esc(s.app)}</b></div>
        <div class="muted" style="font-size:12px">до ${s.expires_on}${s.period_days?` · период ${s.period_days} дн.`:''}${s.price?` · ${s.currency==='UZS'?Math.round(s.price).toLocaleString('ru-RU')+' сум':'$'+s.price}`:''}</div></div>
      <div style="display:flex;gap:6px;align-items:center;flex:0 0 auto">${mark}
        ${admin?`<button class="xbtn" data-subrenew="${s.id}" title="Продлить на период">↻</button>`:''}</div>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="row"><h3>💳 Подписки</h3>${admin?'<button class="btn sm" data-subnew>＋ Добавить</button>':''}</div>

}

    SUB_EDIT=f?{...f,price:f.price||'',currency:f.currency||'USD'}:{app:'',period_days:30,purchased_on:today,expires_on:'',price:'',currency:'USD'};
  }
  const e=SUB_EDIT;
  return `<div class="card">
    <div class="row"><h3>${isNew?'Новая подписка':esc(e.app||'Подписка')}</h3><button class="btn sm sec" data-subclose>← назад</button></div>

    <div class="muted" style="margin-top:6px">Дата оплаты:</div><input type="date" id="sb_bought" value="${esc(e.purchased_on||'')}">

function renderWork(){
  if(DATA.user.role!=='admin'){
    const my=DATA.myTasks||[];
    let h='<div class="card"><h3>🗂️ Моя работа</h3>';
    h+= my.length ? my.map(t=>`<div class="vid"><span>${esc(t.title)}</span><button class="btn sm" data-done="${t.id}">Выполнено</button></div>`).join('') : '<div class="muted">Активных задач нет 🎉</div>';
    h+='</div>';
    return h;
  }
  const team=DATA.team||[];
  if(WORK_EMP>=team.length) WORK_EMP=0;
  const chips=team.map((m,i)=>`<div class="pill ${i==WORK_EMP?'active':''}" data-emp="${i}">${esc(m.name)}</div>`).join('');
  const m=team[WORK_EMP];
  if(!m) return '<div class="empty">Нет сотрудников</div>';
  let statsBlock='';
  if(m.stats){
    const s=m.stats;
    const onTimePct=s.done?Math.round(s.onTime/s.done*100):0;
    statsBlock=`<div class="card">
      <div class="muted" style="font-weight:600;margin-bottom:6px">📊 Статистика</div>
      <div class="row"><span class="muted">Закрыто задач</span><b>${s.done} из ${s.total}</b></div>
      <div class="row"><span class="muted">Вовремя / с опозданием</span><b>${s.onTime} / ${s.late}</b></div>
      ${bar(s.onTime,s.onTime+s.late)}
      <div class="row" style="margin-top:4px"><span class="muted">Открытых сейчас</span><b>${s.open}</b></div>
    </div>`;
  }
  let body=`<div class="card"><div class="row"><h3>${esc(m.name)}</h3><span class="badge">${m.role}</span></div>`;
  if(!m.registered) body+='<div class="muted">Ещё не заходил в бота (/start)</div>';
  if(!m.tasks.length) body+='<div class="muted">Активных задач нет</div>';
  body+=m.tasks.map(t=>{
    const pend=['await_manager','await_admin','await_confirm'].includes(t.status);
    const st=pend?'<span class="badge">на утв.</span>':'';
    const btn=pend?`<button class="btn sm" data-approve="${t.id}">✅</button>`:'';
    const del=DATA.user.role==='admin'?`<button class="xbtn" data-taskdel="${t.id}" title="Удалить задачу">🗑</button>`:'';
    return `<div class="vid"><span>${esc(t.title)} ${st}</span><div style="display:flex;gap:6px">${btn}${del}</div></div>`;
  }).join('');
  body+='</div>';
  return `<div class="pills">${chips}</div>${statsBlock}${body}`;
}

function renderTZ(){
  const secPills=SEC.map(([k,l])=>`<div class="pill ${k==TZ_SEC?'active':''}" data-sec="${k}">${l}</div>`).join('');
  const specs=(DATA.specialists&&DATA.specialists[TZ_SEC])||[];
  if(TZ_EXEC==null && specs.length) TZ_EXEC=specs[0].id;
  const execPills=specs.length
    ? specs.map(s=>`<div class="pill ${s.id==TZ_EXEC?'active':''}" data-exec="${s.id}">${esc(s.name)}</div>`).join('')
    : '<div class="muted" style="font-size:12px">Нет сотрудника с этой ролью — назначь роль во вкладке «Команда».</div>';
  const projPills=`<div class="pill ${TZ_PROJ===''?'active':''}" data-tzp="">Общее</div>`+DATA.projects.map(p=>`<div class="pill ${TZ_PROJ==p.id?'active':''}" data-tzp="${p.id}">${esc(p.name)}</div>`).join('');
  const fieldsHtml=(TZ_TEMPLATES[TZ_SEC]||[]).map(([id,label,big])=>{
    const v=TZ_FIELDS[id]||'';
    if(id==='deadline') return `<div class="muted">${label}:</div>${pickerPair('tz_'+id,v,'ДД.ММ или ДД.ММ ЧЧ:ММ',true,'')}`;
    if(id==='shoot') return `<div class="muted">${label}:</div>${pickerPair('tz_'+id,v,'ДД.ММ',false,'')}`;
    return big
      ? `<div class="muted">${label}:</div><textarea id="tz_${id}" style="min-height:60px">${esc(v)}</textarea>`
      : `<div class="muted">${label}:</div><input id="tz_${id}" value="${esc(v)}">`;
  });
  let itemPicker='';
  if(TZ_SEC==='video' && TZ_PROJ){
    if(TZ_ITEMS_FOR!==TZ_PROJ){ TZ_ITEMS=null; TZ_ITEMS_FOR=TZ_PROJ; api('POST',{type:'plan_active_items',projectId:TZ_PROJ}).then(r=>{TZ_ITEMS=(r&&r.items)||[]; render();}); }
    const items=TZ_ITEMS||[];
    const pills='<div class="pill '+(TZ_ITEM==null?'active':'')+'" data-tzitem="">Без привязки</div>'
      +items.map(it=>`<div class="pill ${TZ_ITEM==it.id?'active':''}" data-tzitem="${it.id}">#${it.idx}${it.theme?': '+esc(it.theme.slice(0,18)):''}</div>`).join('');
    itemPicker=`<div class="muted">Привязать к пункту плана (чтобы задача авто-закрылась при отметке «Снято»):</div><div class="pills">${pills}</div>`;
  } else if(TZ_ITEM!=null){ TZ_ITEM=null; }
  const photoBlock=TZ_PHOTO
    ? `<div class="row" style="gap:8px;align-items:center;margin:6px 0"><img src="${TZ_PHOTO}" style="max-height:90px;border-radius:8px"><button class="xbtn" data-tzphoto-clear>✕ убрать фото</button></div>`
    : `<div class="muted">Фото (необязательно):</div><input type="file" id="tzPhoto" accept="image/*">`;
  // первое поле шаблона — главный текст ТЗ (идея / сценарий / текст): на широком экране он слева
  return `<div class="card"><h3>✍️ Дать ТЗ</h3>
    <div class="split">
    <div class="sp-meta">
    <div class="muted">Раздел:</div><div class="pills">${secPills}</div>
    <div class="muted">Исполнитель:</div><div class="pills">${execPills}</div>
    <div class="muted">Проект:</div><div class="pills">${projPills}</div>
    ${itemPicker}
    </div>
    <div class="sp-main" style="border-top:1px solid rgba(127,127,127,.2);margin:8px 0;padding-top:6px">${fieldsHtml[0]||''}</div>
    <div class="sp-extra">
    ${fieldsHtml.slice(1).join('')}
    ${photoBlock}
    <button class="btn full" data-tz-send>📨 Отправить ТЗ</button>
    <div class="muted" style="margin-top:8px">Заполни нужные поля — ТЗ уйдёт исполнителю в личку и в привязанную группу.</div>
    </div>
    </div></div>`;
}

let TEAM_PERM_OPEN=null, TEAM_ROLE_OPEN=null, TEAM_PROJ_OPEN=null;
function renderTeam(){
  const rows=(DATA.teamAll||[]).map(m=>{
    const roles=m.isAdmin?['admin']:(m.roles&&m.roles.length?m.roles:['member']);
    const isCustom=!!(m.tabs&&m.tabs.length);

    const roleBadges=roles.map(r=>ROLE_LABEL_TEAM[r]||r).join(', ');
    const rolePanel=TEAM_ROLE_OPEN===m.id?`<div class="card" style="margin:6px 0 10px">

      <button class="btn xs" data-rolesave="${m.id}" style="margin-top:10px">Сохранить</button>

    const permPanel=TEAM_PERM_OPEN===m.id?`<div class="card" style="margin:6px 0 10px">

      <button class="btn xs" data-projsave="${m.id}" style="margin-top:10px">Сохранить</button>

      <button class="xbtn" data-teamdel="${m.id}" title="Удалить из команды">🗑</button>
    </div>${rolePanel}${permPanel}${projPanel}`;
  }).join('');
  return `<div class="card"><h3>👥 Команда</h3>
    ${rows||'<div class="muted">Пока никто не заходил в бота.</div>'}

    <br><br>📁 Свои проекты менеджера: по ним он каждое утро получает идеи. Обычный менеджер к тому же видит в таблице только их (ничего не отмечено — видит все). Проджект-менеджер видит всё в любом случае, а 📁 у него только отмечает, за какие проекты он отвечает.
    <br><br>🔗 Личная группа: чтобы ТЗ и напоминания о дедлайнах дублировались человеку не только в личку, но и в его группу — добавь бота в эту группу и напиши там команду <code>/bindperson Имя</code> (или его telegram_id). Отвязать можно кнопкой 🔗✕ здесь.</div></div>`;
}

// что и таблица контент-плана — единый источник данных, календарь просто другой вид) ----
let CAL_CURSOR=null, CAL_DAY=null, CAL_ADD=false;
let CAL_ADD_PROJ=null, CAL_ADD_ITEMS=null, CAL_ADD_SEL=null, CAL_ADD_MANAGER=null, CAL_ADD_TIME='', CAL_ADD_EXISTING=[];
let CAL_EDIT_PROJ=null, CAL_EDIT_MGR=null;
const CAL_WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MONTH_NAMES=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function isoKey(y,m,day){ return `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`; }
// якорим на Ташкент (+5), а не на локаль устройства зрителя — иначе граница дня "плывёт"
function tashkentNow(){ return new Date(Date.now()+5*3600*1000); }
function calCycleStart(d){ let y=d.getUTCFullYear(), m=d.getUTCMonth(); if(d.getUTCDate()<15){ m--; if(m<0){m=11;y--;} } return {y,m}; }
function monthColor(m){ return `hsl(${m*30},32%,17%)`; }
function renderCalendar(){
  if(!CAL_CURSOR) CAL_CURSOR=calCycleStart(tashkentNow());
  const {y,m}=CAL_CURSOR;
  const endM=m===11?0:m+1, endY=m===11?y+1:y;
  const startUTC=Date.UTC(y,m,15), endUTC=Date.UTC(endY,endM,14);
  const days=[];
  for(let t=startUTC;t<=endUTC;t+=86400000){ const dt=new Date(t); days.push({y:dt.getUTCFullYear(),m:dt.getUTCMonth(),day:dt.getUTCDate(),wd:dt.getUTCDay()}); }
  const shootsByDay={};
  (DATA.calendarShoots||[]).forEach(s=>{ (shootsByDay[s.day]=shootsByDay[s.day]||[]).push(s); });
  const nowT=tashkentNow();
  const todayKey=isoKey(nowT.getUTCFullYear(),nowT.getUTCMonth(),nowT.getUTCDate());
  const leadBlank=(days[0].wd+6)%7; // неделя с понедельника
  const cells=[]; for(let i=0;i<leadBlank;i++) cells.push(null); days.forEach(d=>cells.push(d));
  while(cells.length%7) cells.push(null);
  const cellsHtml=cells.map(d=>{
    if(!d) return '<div class="calcell empty"></div>';
    const key=isoKey(d.y,d.m,d.day);
    const shoots=shootsByDay[key]||[];
    const groupCount=new Set(shoots.map(s=>s.projectId)).size; // считаем съёмки (проекты), не видео по отдельности
    const cls=['calcell']; if(shoots.length) cls.push('has-shoot'); if(key===todayKey) cls.push('today'); if(key===CAL_DAY) cls.push('sel');
    return `<div class="${cls.join(' ')}" data-calday="${key}" style="background:${monthColor(d.m)}">
      <div class="calnum">${d.day}</div>
      ${groupCount?`<div class="caldot">🎬${groupCount>1?' '+groupCount:''}</div>`:''}
    </div>`;
  }).join('');
  const label=`${MONTH_NAMES[m]} → ${MONTH_NAMES[endM]} (15.${String(m+1).padStart(2,'0')}–14.${String(endM+1).padStart(2,'0')})`;

  let dayPanel='';
  if(CAL_DAY){
    const shoots=shootsByDay[CAL_DAY]||[];
    // одна реальная съёмка = один проект в этот день, а не по видео отдельно
    const byProj={};
    shoots.forEach(s=>{ (byProj[s.projectId]=byProj[s.projectId]||{projectId:s.projectId,projectName:s.projectName,items:[]}).items.push(s); });
    const groups=Object.values(byProj);
    const [dy,dm,dd]=CAL_DAY.split('-');
    dayPanel=`<div class="card" style="margin-top:10px">
      <div class="row"><h3>${dd}.${dm}.${dy}</h3><button class="btn sm sec" data-caldayclose>✕</button></div>
      ${groups.length?groups.map(g=>{
        const first=g.items[0];
        const editForm=CAL_EDIT_PROJ===g.projectId?`<div class="card" style="margin-top:6px;padding:10px">
          <div class="muted">Менеджер на съёмке:</div><div class="pills">${(DATA.calendarManagers||[]).map(mm=>`<div class="pill ${CAL_EDIT_MGR==mm.id?'active':''}" data-caleditmgr="${mm.id}">${esc(mm.name)}</div>`).join('')||'<div class="muted" style="font-size:12px">Нет менеджеров в команде</div>'}</div>
          <div class="muted" style="margin-top:6px">Время:</div><input type="time" id="caledit_time" value="${esc(first.shoot_time||'')}">
          <div class="row" style="gap:6px;margin-top:8px"><button class="btn xs" data-caleditsave="${g.projectId}">💾 Сохранить</button><button class="btn xs sec" data-caleditcancel>Отмена</button></div>
        </div>`:'';
        const itemsList=g.items.map(s=>`<div class="muted" style="font-size:13px">• ${esc(s.theme||'без темы')}${s.format?' · '+formatLabel(s.format):''}</div>`).join('');
        return `<div class="vid" style="align-items:flex-start">
        <div style="min-width:0;flex:1">
          <div><b>${esc(g.projectName)}</b> <span class="muted" style="font-size:12px">(${g.items.length} видео)</span></div>
          ${itemsList}
          <div class="muted" style="font-size:12px;margin-top:2px">${first.shoot_time?'🕒 '+esc(first.shoot_time)+' · ':''}${first.shoot_manager?'👤 '+esc(first.shoot_manager):'менеджер не назначен'}</div>
          ${editForm}
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;flex:0 0 auto">
          <button class="xbtn" data-caledittoggle="${g.projectId}" title="Менеджер/время">✎</button>
          <button class="xbtn" data-caladdmore="${g.projectId}" title="Добавить ещё видео в эту съёмку">＋видео</button>
          <button class="xbtn" data-caljump="${first.id}:${first.projectId}:${first.planId}">Открыть →</button>
          <button class="xbtn" data-calcleargroup="${g.items.map(s=>s.id).join(',')}" title="Убрать всю съёмку">✕ дата</button>
        </div>
      </div>`;
      }).join(''):'<div class="muted">Съёмок не назначено</div>'}
      ${CAL_ADD?renderCalAddForm():`<button class="btn sm full" data-caladdopen style="margin-top:8px">＋ Назначить съёмку</button>`}
    </div>`;
  }

  return `<div class="card">
    <div class="row"><button class="btn sm sec" data-calprev>◀</button><h3 style="text-align:center;flex:1">${label}</h3><button class="btn sm sec" data-calnext>▶</button></div>
    <div class="calgrid">${CAL_WD.map(w=>`<div class="calwd">${w}</div>`).join('')}${cellsHtml}</div>
  </div>${dayPanel}`;
}
function renderCalAddForm(){

    <div class="row" style="gap:6px;margin-top:8px">
      <button class="btn sm" data-caladdsave>💾 Назначить</button>
      <button class="btn sm sec" data-caladdcancel>Отмена</button>

// ---- недельный план (Пн–Вс): задачи по сотрудникам на каждый день ----
// хранятся как обычные задачи с дедлайном на этот день, поэтому попадают
// и в «Мои задачи», и в напоминания, и в статистику
let WK_START=null, WK_TASKS=null, WK_PLANNER=false, WK_LOADED=null, WK_EMP=null, WK_DAY=null;
function mondayOf(d){ const wd=(d.getUTCDay()+6)%7; return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-wd)); }
function wkKey(dt){ return dt.toISOString().slice(0,10); }
function wkShift(iso,days){ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+days); return wkKey(d); }
async function wkLoad(){
  WK_LOADED=WK_START;
  const res=await api('POST',{type:'week_tasks',weekStart:WK_START});
  WK_TASKS=(res&&res.weekTasks)||[]; WK_PLANNER=!!(res&&res.weekPlanner);
  render();
}
function renderWeek(){
  if(!WK_START) WK_START=wkKey(mondayOf(tashkentNow()));
  if(WK_LOADED!==WK_START){ WK_TASKS=null; setTimeout(wkLoad,0); }
  const days=[...Array(7)].map((_,i)=>wkShift(WK_START,i));
  const dLabel=iso=>{const[,m,d]=iso.split('-');return d+'.'+m;};
  const range=dLabel(days[0])+' – '+dLabel(days[6]);
  // без подписи непонятно, какая неделя открыта, и что стрелки вообще листают недели
  const thisMon=wkKey(mondayOf(tashkentNow()));
  const diffW=Math.round((new Date(WK_START+'T00:00:00Z')-new Date(thisMon+'T00:00:00Z'))/604800000);
  const weekLabel=diffW===0?'эта неделя':diffW===1?'следующая':diffW===-1?'прошлая':(diffW>0?`через ${diffW} нед.`:`${-diffW} нед. назад`);
  if(WK_TASKS===null) return `<div class="card"><h3>🗓 Недельный план</h3>${umcLoader()}</div>`;

  const nowKey=wkKey(tashkentNow());
  // кого показываем: планировщик видит всех, остальные — только себя
  const people=WK_PLANNER
    ? (DATA.assignable&&DATA.assignable.length?DATA.assignable:[{id:DATA.user.id,name:DATA.user.name,role:''}])
    : [{id:DATA.user.id,name:DATA.user.name||'Мои задачи',role:''}];
  if(WK_EMP==null||!people.some(p=>p.id===WK_EMP)) WK_EMP=people[0]?.id??null;
  const empPills=WK_PLANNER&&people.length>1
    ? `<div class="pills">${people.map(p=>{
        const cnt=WK_TASKS.filter(t=>t.assigneeId===p.id).length;
        return `<div class="pill ${p.id===WK_EMP?'active':''}" data-wkemp="${p.id}">${esc(p.name)}${cnt?' · '+cnt:''}</div>`;
      }).join('')}</div>`
    : '';

  const rows=days.map(iso=>{
    const list=WK_TASKS.filter(t=>t.day===iso&&t.assigneeId===WK_EMP);
    const done=list.filter(t=>t.status==='done').length;
    const isToday=iso===nowKey;
    const items=list.length?list.map(t=>{
      const isDone=t.status==='done';
      const mine=t.assigneeId===DATA.user.id;
      const btn=!isDone&&mine?`<button class="btn xs" data-done="${t.id}">Выполнено</button>`:'';
      const del=DATA.user.role==='admin'?`<button class="xbtn" data-taskdel="${t.id}" title="Удалить">🗑</button>`:'';
      return `<div class="wkitem"><span style="min-width:0;flex:1;${isDone?'opacity:.55;text-decoration:line-through':''}">${esc(t.title)}</span><span style="display:flex;gap:4px;flex:0 0 auto">${btn}${del}</span></div>`;
    }).join(''):'<div class="muted" style="font-size:12px">—</div>';
    const addForm=(WK_PLANNER&&WK_DAY===iso)
      ? `<div style="margin-top:6px"><input id="wk_title" placeholder="Что нужно сделать…"><div class="row" style="gap:6px;margin-top:6px"><button class="btn xs" data-wkadd="${iso}">Добавить</button><button class="btn xs sec" data-wkaddcancel>Отмена</button></div></div>`
      : (WK_PLANNER?`<button class="btn xs sec" data-wkaddopen="${iso}" style="margin-top:6px">＋ задача</button>`:'');
    return `<div class="card wkday ${isToday?'wktoday':''}">
      <div class="row"><b>${CAL_WD[days.indexOf(iso)]}, ${dLabel(iso)}${isToday?' · сегодня':''}</b>${list.length?`<span class="chip">${done}/${list.length}</span>`:''}</div>
      ${items}${addForm}
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="row"><button class="btn sm sec" data-wkprev title="Предыдущая неделя">◀</button>
      <div style="flex:1;min-width:0;text-align:center"><h3 style="margin:0">🗓 ${range}</h3><div class="muted" style="font-size:12px">${weekLabel}</div></div>
      <button class="btn sm sec" data-wknext title="Следующая неделя">▶</button></div>
    ${diffW===0?'<div class="muted" style="font-size:12px;margin-top:4px">▶ — спланировать следующую неделю заранее</div>':''}
    ${empPills}
    ${WK_PLANNER?'':'<div class="muted" style="font-size:12px">Твои задачи на эту неделю.</div>'}
  </div>${rows}`;
}

// Замер до того, как раскладка устоялась, давал абсурдную высоту, и она «запекалась»
// в inline-стиль навсегда. Поэтому: скрытые не трогаем, высоту ограничиваем сверху,
// и после рендера перемеряем в следующем кадре, когда стили уже применены.
function autoGrow(t){
  if(t.offsetHeight===0 && !t.offsetParent) return;
  t.style.height='auto';
  t.style.height=Math.min(t.scrollHeight+2,600)+'px';
}
function autoGrowAll(){ document.querySelectorAll('textarea').forEach(autoGrow); }
// ---- финансы (только админ): доходы от клиентов, расходы, зарплаты команды ----
// Данные грузятся отдельно (fin_load) — в общий DATA не входят, чтобы зарплаты не
// уезжали в каждый ответ приложения.
let FIN=null, FIN_CYCLE=null, FIN_LOADING=false, FIN_ERR=null, FIN_SEC='overview', FIN_CUR='USD', FIN_FORM=null, FIN_PERSON=null;
const FIN_SECS=[["overview","📊 Обзор"],["income","💵 Доходы"],["expense","🧾 Расходы"],["team","👥 Зарплаты"]];
const FIN_CAT={
  income:[["fee","Оплата по договору"],["other","Другой доход"]],
  expense:[["ads","Реклама"],["subs","Подписки"],["location","Локация / аренда"],["props","Реквизит"],["transport","Транспорт"],["equipment","Техника"],["other","Другое"]],
  accrual:[["bonus","Премия"],["deduction","Вычет"],["other","Другое"],["salary","Оклад"],["project_fixed","Фикс за проект"],["shoot","Съёмка"],["edit","Монтаж"],["graphic","Графика"]],
  payout:[["salary","Выплата"]],
};
const FIN_RULE_KINDS=[["salary","Оклад по должности"],["project_fixed","Фикс за проект"],["shoot","За съёмку видео"],["edit","За монтаж видео"],["graphic","За графику"]];
const FIN_SCHED=[["prepay","100% в начале цикла"],["split","50% в начале + 50% в конце"],["post","100% в конце цикла"],["manual","Вручную / частями"]];
const FIN_KIND_TITLE={income:"Доход",expense:"Расход",accrual:"Начисление",payout:"Выплата"};
function finCatLabel(kind,cat){ const o=(FIN_CAT[kind]||[]).find(x=>x[0]===cat); return o?o[1]:(cat||'—'); }
function finRuleLabel(k){ const o=FIN_RULE_KINDS.find(x=>x[0]===k); return o?o[1]:k; }
function finSchedLabel(k){ const o=FIN_SCHED.find(x=>x[0]===k); return o?o[1]:k; }
function fUZS(n){ return Math.round(n||0).toLocaleString('ru-RU')+' сум'; }
function fUSD(n){ const v=Math.round((n||0)*100)/100; return (v<0?'−':'')+'$'+Math.abs(v).toLocaleString('ru-RU',{maximumFractionDigits:Math.abs(v)<100?2:0}); }
function fNative(n,c){ return c==='USD'?fUSD(n):fUZS(n); }
// одна сумма сразу в двух валютах: выбранная — крупно, вторая — мелко
function fBoth(uzs,usd){ return FIN_CUR==='USD'?`<b>${fUSD(usd)}</b> <span class="muted">· ${fUZS(uzs)}</span>`:`<b>${fUZS(uzs)}</b> <span class="muted">· ${fUSD(usd)}</span>`; }
function fOne(uzs,usd){ return FIN_CUR==='USD'?fUSD(usd):fUZS(uzs); }
function finSum(list){ return list.reduce((a,e)=>({uzs:a.uzs+(e.uzs||0),usd:a.usd+(e.usd||0)}),{uzs:0,usd:0}); }
// сумма в родной валюте каждой записи — для зарплат, где пересчёт курсом только путает
function finNat(list){ const o={UZS:0,USD:0}; for(const e of list) o[e.currency==='USD'?'USD':'UZS']+=e.amount; return o; }
function fNat(o){ return [o.USD?fUSD(o.USD):'',o.UZS?fUZS(o.UZS):''].filter(Boolean).join(' + ')||'0'; }
function finAdd(a,b,k){ return {uzs:a.uzs+k*b.uzs,usd:a.usd+k*b.usd}; }
function finCycleLabel(c){
  const[y,m]=c.split('-').map(Number);
  const s=new Date(Date.UTC(y,m-1,15)), e=new Date(Date.UTC(y,m,14));
  const d=x=>String(x.getUTCDate()).padStart(2,'0')+'.'+String(x.getUTCMonth()+1).padStart(2,'0');
  return `${d(s)} – ${d(e)}.${e.getUTCFullYear()}`;
}
function finShift(c,n){ const[y,m]=c.split('-').map(Number); const d=new Date(Date.UTC(y,m-1+n,1)); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0'); }
function finToday(){ return wkKey(tashkentNow()); }
function finDate(iso){ return iso?iso.split('-').reverse().join('.'):''; }
function finProjName(id){ if(id==null) return 'Общие'; const p=(FIN&&FIN.projects||[]).find(x=>x.id==id); return p?p.name:'—'; }
function finPersonName(id){ const p=(FIN&&FIN.people||[]).find(x=>x.id==id); return p?p.name:'— не указан —'; }
async function finLoad(){
  FIN_LOADING=true; FIN_ERR=null; render();
  try{
    const r=await api('POST',{type:'fin_load',cycle:FIN_CYCLE});
    if(!r||r.error){ FIN_ERR=(r&&r.error)||'ошибка'; } else { FIN=r; FIN_CYCLE=r.cycle; }
  }catch(e){ FIN_ERR='нет связи'; }
  FIN_LOADING=false; render();
}
// действие + свежие данные финансов в ответ; true — если прошло без ошибки
async function finAct(payload){
  if(ACT_BUSY) return false;
  ACT_BUSY=true; haptic();
  try{
    const r=await api('POST',{...payload,cycle:FIN_CYCLE});
    if(!r||r.error){ tg.showAlert&&tg.showAlert((r&&r.error)||'ошибка'); return false; }
    FIN=r; return true;
  }catch(e){ tg.showAlert&&tg.showAlert('нет связи — не сохранено'); return false; }
  finally{ ACT_BUSY=false; }
}
